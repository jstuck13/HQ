<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HQ — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hq.css">
<style>

  .mast{margin-top:20px;padding-top:18px;border-top:1px solid rgba(242,236,223,.28)}
  h1{font-size:32px;line-height:1.3;text-wrap:balance;max-width:40ch}
  h1 em{font-style:italic}

  main{max-width:1180px;margin:0 auto;padding:34px 40px 44px;display:grid;grid-template-columns:1.1fr 1fr;gap:64px}
  h2 small a{border-bottom:1px solid var(--rule)} h2 small a:hover{color:var(--ink);border-color:var(--ink)}

  /* hour-ruled timeline (clean's donation, in ink and paper) */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 20px;margin-top:14px}
  .tl{position:relative;height:calc(var(--hour) * 12)}
  .hr{position:absolute;left:0;right:0;display:flex;gap:14px;align-items:flex-start;font-family:var(--serif);font-size:13px;color:var(--ink-3)}
  .hr::after{content:"";flex:1;border-top:1px solid var(--rule);transform:translateY(9px)}
  .hr span{width:42px;text-align:right}
  .ev{position:absolute;left:60px;right:0;min-height:30px;background:var(--c);border-radius:10px;padding:6px 12px;font-size:14.5px;line-height:1.3;transition:transform .15s,box-shadow .15s}
  .ev:hover{transform:translateX(2px);box-shadow:var(--shadow)}
  .ev.cal{--c:var(--a-cal)} .ev.fit{--c:var(--a-fit)} .ev.health{--c:var(--a-health)} .ev.study{--c:var(--a-study)}
  .ev b{display:block;font-family:var(--serif);font-weight:400}
  .ev small{color:var(--ink-3);font-size:12.5px}
  .now{position:absolute;left:46px;right:0;height:1.5px;background:var(--ox);z-index:2;pointer-events:none}
  .now::before{content:"";position:absolute;left:-1px;top:50%;margin-top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--ox)}
  .now::after{content:attr(data-t);position:absolute;right:0;top:-21px;font-family:var(--serif);font-size:12px;color:var(--band-ink);background:var(--ox);padding:2px 8px;border-radius:6px}
  .ev.live b{color:var(--ox)}
  .td{position:absolute;left:64px;right:0;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--ink-3);padding-top:3px;transform:translateY(-1px);pointer-events:none}
  .td span{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:0 6px 0 0;border-radius:4px;position:relative;z-index:1} .td small{background:var(--card);padding:0 0 0 6px;position:relative;z-index:1}
  .td .ic{width:12px;height:12px;color:var(--ink-3)} .td small{color:var(--ink-3);margin-left:auto} .td.late,.td.late small,.td.late .ic{color:var(--ox)} .td.late{border-color:var(--ox)}
  .card.clear{padding:34px 28px 32px;text-align:center}
  .card.clear b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:22px;margin-bottom:6px}
  .card.clear small{color:var(--ink-3);font-size:13px}
  .card.clear a{border-bottom:1px solid var(--rule)} .card.clear a:hover{border-color:var(--ink)}
  .card.clear::before,.rep.empty::before{content:"";display:block;width:160px;height:12px;margin:0 auto 12px;background:var(--ornament)}
  .todo .empty{text-align:center;padding:18px 0;max-width:34ch;margin:0 auto;color:var(--ink-3);font-style:italic;font-family:var(--serif);border:0;display:block}
  .todo .empty::before{content:"";display:block;width:min(160px,100%);height:12px;margin:0 auto 10px;background:var(--ornament)}
  .upnext{margin:10px 0 0;font-size:14px;color:var(--band-muted);display:flex;flex-wrap:wrap;gap:6px 22px}
  .upnext .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-ink);margin-right:8px}
  .upnext b{font-family:var(--serif);font-weight:400;color:var(--band-ink)}
  .upnext .t{white-space:nowrap}
  #wx{margin-top:6px}

  /* morning report: last night and the body, read from Health */
  .report{margin-top:34px}
  .rep{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:start}
  .rep .big{grid-row:1/3}
  .rep .big b{display:block;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em}
  .rep .big b i{font-style:normal;font-size:17px;color:var(--ink-3);margin-left:4px}
  .rep .big span{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
  .rep .big small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .rep .stages{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--paper-2);margin-top:8px}
  .rep .stages i{display:block;height:100%}
  .rep .stages .deep{background:var(--band)} .rep .stages .light{background:var(--sage)} .rep .stages .rem{background:var(--lilac)} .rep .stages .awake{background:var(--rule)}
  .rep .legend{font-size:12px;color:var(--ink-3);margin-top:6px}
  .rep .legend b{font-weight:500;color:var(--ink-2)}
  .rep .facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-top:12px;padding-top:14px;border-top:1px dotted var(--rule)}
  .rep .facts li b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1;display:block}
  .rep .facts li b i{font-style:normal;font-size:13px;color:var(--ink-3);margin-left:3px}
  .rep .facts li span{display:block;font-size:12.5px;color:var(--ink-2)}
  .rep .facts li small{display:block;font-size:12px;color:var(--ink-3)}
  .rep.empty{display:block;text-align:center;padding:28px 24px}
  .rep.empty b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:20px;margin-bottom:4px}
  .rep.empty small{color:var(--ink-3);font-size:13px}
  .rep.empty a{border-bottom:1px solid var(--rule)} .rep.empty a:hover{border-color:var(--ink)}

  .affedit{margin:10px 0 4px;padding:14px 16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
  .arrange{list-style:none;margin:0;padding:0}
  .arrange li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule)}
  .arrange li:last-child{border-bottom:0}
  .arrange input{appearance:none;width:15px;height:15px;border:1px solid var(--ink-2);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--paper);border-radius:2px}
  .arrange input:checked{background:var(--band);border-color:var(--band)}
  .arrange input:checked::after{content:"";width:7px;height:4px;border:1.5px solid var(--band-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
  .arrange label{font-family:var(--serif);font-size:15.5px;cursor:pointer;margin-right:auto}
  .arrange .mv{font-size:13px;color:var(--ink-3);padding:2px 6px;border-radius:4px;background:none;border:0;cursor:pointer}
  .arrange .mv:hover:not([disabled]){color:var(--ink);background:var(--paper-2)}
  .arrange .mv[disabled]{opacity:.25;cursor:default}
  .arrn{margin:12px 0 0;font-size:12.5px;color:var(--ink-3)}
  .arrn .textbtn{margin-left:10px}
  .affairs li.empty{display:block;font-family:var(--serif);font-style:italic;color:var(--ink-3);padding:14px 0;border:0}
  .affairs li{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:baseline}
  .affairs .n{grid-column:1;grid-row:1;font-family:var(--serif);font-size:17px;border-bottom:1px solid transparent}
  .affairs .n:hover{border-bottom-color:var(--ink)}
  .affairs .over{font-weight:500;color:var(--ox)}
  .affairs .d{grid-column:1;grid-row:2;color:var(--ink-2);font-size:13.5px}
  .affairs .v{grid-column:2;grid-row:1/3;font-family:var(--serif);font-size:24px;text-align:right;line-height:1.1}
  .affairs .v small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px}
  .affairs .v.flag small{color:var(--ox)}
  h2 .otherday{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-left:auto;border-bottom:1px solid var(--rule)}
  h2 .otherday:hover{color:var(--ox);border-bottom-color:var(--ox)}
  .todo{margin-top:34px}
  .propose{margin-top:10px;padding:14px 16px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
  .propose .pq{margin:0 0 8px;font-family:var(--serif);font-size:15px}
  .propose ul{list-style:none;margin:0;padding:0}
  .propose li{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dotted var(--rule)}
  .propose li:last-child{border-bottom:0}
  .propose .t{font-family:var(--serif);font-size:15.5px;flex:1}
  .propose .w{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .propose .pa{margin:10px 0 0;display:flex;gap:18px}
  .todo .tg{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .todo .tg .did{width:3.2ch;font-family:var(--serif);font-size:14px;text-align:right;border-bottom:1px dotted var(--ink-2);background:none;padding:0;color:var(--ink)}
  .todo .tg .did:focus{outline:none;border-bottom-color:var(--ink)}
  .todo .skip{color:var(--ink-3);opacity:0;transition:opacity .15s}
  .todo li:hover .skip,.todo li:focus-within .skip{opacity:1} .todo .skip:hover{color:var(--ox)}
  .reps li.over{opacity:.55}
  .saidt{margin:8px 0 0;font-size:13px;color:var(--ox);font-family:var(--serif);font-style:italic}
  .reps{list-style:none;margin:10px 0 0;padding:0}
  .reps li{display:flex;align-items:baseline;gap:12px;padding:6px 0;border-top:1px dotted var(--rule);font-size:13.5px;color:var(--ink-2)}
  .reps li span{font-family:var(--serif);font-size:14.5px}
  .reps li small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
  .reps li .textbtn{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
  .todo .rp{color:var(--ink-3);font-size:13px;margin-left:6px}
  .todo ul{border-left:1px solid color-mix(in srgb, var(--ox) 32%, transparent);padding-left:14px}
  .todo li{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule)}
  .todo input[type=checkbox]{appearance:none;width:15px;height:15px;border:1px solid var(--ink-2);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--paper);border-radius:2px}
  .todo input[type=checkbox]:checked{background:var(--band);border-color:var(--band)}
  .todo input[type=checkbox]:checked::after{content:"";width:7px;height:4px;border:1.5px solid var(--band-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
  .todo label{cursor:pointer;margin-right:auto}
  .todo input[type=checkbox]:checked + label{color:var(--ink-3);background:linear-gradient(currentColor,currentColor) left 58%/100% 1px no-repeat}
  .todo .w{font-size:12.5px;color:var(--ink-3)}
  .todo .w.due{color:var(--ox)}
  .todo .w.from{font-style:italic;font-family:var(--serif)}
  .todo li{position:relative} .todo .x{opacity:0;position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--paper);padding-left:10px}   /* out of the flow, so the time sits flush right */
  .todo li:hover .x,.todo li:focus-within .x{opacity:1} .todo .x:hover{color:var(--ox)}
  .addt{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;align-items:baseline}
  .addt input{width:100%;font-family:var(--serif);font-size:15px;border-bottom:1px dotted var(--ink-2);padding:2px 0}
  .addt input:focus{outline:none;border-bottom-color:var(--ink)}
  .addt input::placeholder{color:var(--ink-3);font-style:italic}
  .addt .textbtn{font-size:13.5px}
  .hr span{width:46px}
  .ev{left:64px} .now{left:50px}
  .ev.cal,.ev.fit,.ev.health,.ev.study{}

  @media (prefers-reduced-motion:reduce){.ev{transition:none}}
  @media (max-width:900px){
    main{grid-template-columns:1fr;gap:36px;padding:24px 20px 36px} .card{padding:12px 10px 14px} .card.rep,.card.clear{padding:18px 16px 20px} .rep{grid-template-columns:1fr} .rep .big{grid-row:auto} .rep .stages{margin-top:2px} .rep .facts{grid-template-columns:repeat(2,1fr)} .foot{padding:0 20px 28px}
  }
</style>
</head>
<body>
<header class="band">
  <div class="in">
    <div class="row">
      <a class="mark" href="today.html">HQ</a>
      <span class="date"></span>
      <nav aria-label="Areas"><a href="today.html" aria-current="page">Today</a><a href="calendar.html">Calendar</a><a href="finances.html">Finances</a><a href="library.html">Library</a><a href="school.html">School</a><a href="health.html">Health</a></nav>
      <div class="right">
        <button class="ib" aria-label="Search"><svg class="ic"><use href="icons.svg#search"/></svg></button>
        <button class="ib" aria-label="Notifications"><svg class="ic"><use href="icons.svg#bell"/></svg></button>
        <button class="ib menu" type="button" aria-label="Menu" aria-expanded="false" id="menubtn"><svg class="ic"><use href="icons.svg#menu"/></svg></button>
      </div>
    </div>
    <div class="mast"><h1 id="greet">Good morning, Jacob.</h1><p class="upnext" id="upnext" hidden></p><p class="upnext" id="wx" hidden></p></div>
  </div>
</header>

<main>
  <section>
    <h2>The day<small id="dayn"></small><a class="otherday" href="day.html?d=">Another day</a></h2>
    <div class="card"><div class="tl" id="tl"></div></div>
    <div class="report">
      <h2>Morning report<small id="repn"></small></h2>
      <div class="card rep" id="rep"></div>
    </div>
  </section>

  <section>
    <h2>State of affairs<small id="affn"></small></h2>
    <div class="affedit" id="affedit" hidden></div>
    <ul class="affairs" id="affairs"></ul>

    <div class="todo">
      <h2>To do<small id="todon"></small></h2>
      <ul id="todo"></ul>
      <form class="addt" id="addt"><input id="t-text" placeholder="Anything: a to-do, 12.40 lunch, 173.2, or Dentist Thursday 3–4 pm" required><button class="textbtn" type="submit"><svg class="ic"><use href="icons.svg#plus"/></svg>Add</button></form>
      <div class="propose" id="propose" hidden></div>
      <p class="saidt" id="saidt" hidden></p>
      <ul class="reps" id="reps"></ul>
    </div>
  </section>
</main>
<p class="foot" id="foot"></p>

<script src="clock.js"></script>
<script src="hq.js"></script>
<script src="store.js"></script>
<script src="bell.js"></script>
<script src="search.js"></script>
<script>
  // Today is a summary: it reads the other pages' documents and derives everything. Only the to-do list is its own.
  const C = clock, TODAY = C.today;
  let NOW = C.now.getHours() + C.now.getMinutes()/60;
  const wd = d => (C.fromISO(d).getDay()+6)%7;
  const YM = TODAY.slice(0,7);

  // ---- the day: from the calendar document ----
  function renderDay(cal){
    const tl = F('tl'); let html='', list=[];
    if(cal && cal.series){
      const isWeekly = s => (s.rep||[]).length>0, repDays = s => [...new Set([wd(s.date), ...(s.rep||[])])];
      const occurs = s => isWeekly(s) ? (TODAY>=s.date && repDays(s).includes(wd(TODAY))) : s.date===TODAY;
      list = cal.series.filter(s=>s.date && occurs(s) && !(cal.hidden||[]).includes(s.cat)).sort((a,b)=>a.start-b.start);
    }
    // 8 to 8, stretched when the day has something earlier or later
    const ats=T.items.filter(i=>i.at!=null && !i.done).map(i=>i.at);
    const H0=Math.min(8, ...list.map(s=>Math.floor(s.start)), ...ats.map(Math.floor)), H1=Math.max(20, ...list.map(s=>Math.ceil(s.end)), ...ats.map(a=>Math.ceil(a+0.5)));
    tl.style.height=`calc(var(--hour) * ${H1-H0})`;
    for(let h=H0; h<H1; h++) html += `<div class="hr" style="top:calc(var(--hour)*${h-H0})"><span>${C.hourLabel(h)}</span></div>`;
    if(cal && cal.series){
      const cats = cal.cats||[], cat = id => cats.find(c=>c.id===id) || {tint:'#E9EEF3'};
      html += list.map(s=>`<a href="calendar.html" class="ev ${s.start<=NOW&&s.end>NOW?'live':''}" style="--c:${cat(s.cat).tint};top:calc(var(--hour)*${s.start-H0} + 9px);height:calc(var(--hour)*${s.end-s.start} - 4px)"><b>${esc(s.title)}</b>${s.end-s.start>=0.75&&s.sub?`<small>${esc(s.sub)}</small>`:''}</a>`).join('');
    }
    T.items.filter(i=>i.at!=null && !i.done && i.at>=H0 && i.at<=H1).forEach(i=>{ html += `<div class="td ${i.at<NOW?'late':''}" style="top:calc(var(--hour)*${i.at-H0} + 9px)"><span><svg class="ic"><use href="icons.svg#check"/></svg>${esc(i.text)}</span><small>by ${h12(i.at)}</small></div>`; });
    if(NOW>=H0 && NOW<=H1) html += `<div class="now" style="top:calc(var(--hour)*${NOW-H0} + 9px)" data-t="${C.time(new Date())}"></div>`;
    const card = tl.parentElement; card.classList.toggle('clear', !list.length); card.querySelector('.clearmsg')?.remove();
    tl.hidden = !list.length; tl.innerHTML = html;
    if(!list.length) card.insertAdjacentHTML('beforeend', `<div class="clearmsg"><b>A clear day.</b><small>Nothing on the calendar · <a href="calendar.html">plan it</a></small></div>`);
    F('dayn').textContent = cal ? (list.length ? `${list.length} ${list.length===1?'item':'items'} · ${C.hourLabel(H0)} to ${C.hourLabel(H1)}` : C.time(new Date())) : 'open Calendar to plan the day';
    return list;
  }

  // ---- morning report: last night and the body, from the Health document ----
  // a streak: days in a row ending today that pass the test; today is skipped, not broken, while it is still open
  const streak = (days, ok, open = () => false) => { let n=0; for(let i=0;i<400;i++){ const d=days[C.iso(C.addDays(C.fromISO(TODAY),-i))]||{}; if(!ok(d)){ if(i===0 && open(d)) continue; break; } n++; } return n; };
  const hm = sec => { const m=Math.round(sec/60); return m>=60 ? `${Math.floor(m/60)} h${m%60?' '+(m%60):''}` : `${m} min`; };
  const num = n => Number(n).toLocaleString('en-US');
  function renderReport(H){
    const el=F('rep'), L=H && H.days && H.days[TODAY] || {}, G=L.garmin||{}, Y=H && H.days && H.days[C.iso(C.addDays(C.fromISO(TODAY),-1))] || {};
    const had = L.sleep!=null || L.hr!=null || L.weight!=null;
    if(!had){ el.className='card rep empty'; el.innerHTML = `<b>Nothing from last night yet.</b><small>${H ? 'Sync Garmin or log it on <a href="health.html">Health</a>.' : 'Open <a href="health.html">Health</a> to start logging.'}</small>`; F('repn').textContent=''; return; }
    el.className='card rep'; let html='';
    if(L.sleep!=null){
      const sum=(G.deep||0)+(G.light||0)+(G.rem||0)+(G.awake||0);
      const ss=streak(H.days, d=>+d.sleep>=7, d=>d.sleep==null);
      html += `<div class="big"><b>${L.sleep}<i>h</i></b><span>asleep${G.nap?` · ${hm(G.nap)} nap`:''}${ss>=3?` · ${ss} days of 7 h+`:''}</span><small>${[L.bed&&L.woke?`${L.bed} to ${L.woke}`:'', G.score!=null?`score ${G.score}`:''].filter(Boolean).join(' · ')}</small></div>`;
      if(sum){ const seg=(k,v)=>v?`<i class="${k}" style="flex:${v}"></i>`:''; html += `<div><div class="stages">${seg('deep',G.deep)}${seg('light',G.light)}${seg('rem',G.rem)}${seg('awake',G.awake)}</div><p class="legend">${[G.deep&&`<b>${hm(G.deep)}</b> deep`,G.light&&`<b>${hm(G.light)}</b> light`,G.rem&&`<b>${hm(G.rem)}</b> REM`,G.awake&&`<b>${hm(G.awake)}</b> awake`].filter(Boolean).join(' · ')}</p></div>`; }
      else html += `<div><p class="legend" style="margin-top:14px">${G.feedback ? esc(String(G.feedback).replace(/_/g,' ').toLowerCase()) : 'Logged by hand'}</p></div>`;
    } else html += `<div class="big"><b>—</b><span>no sleep logged</span></div><div></div>`;
    const facts=[];
    if(L.hr!=null) facts.push(`<li><b>${L.hr}<i>bpm</i></b><span>resting</span>${G.hr7?`<small>7-day ${Math.round(G.hr7)}</small>`:''}</li>`);
    if(L.weight!=null){ const prev=Object.keys(H.days).filter(d=>d<TODAY && H.days[d].weight!=null).sort().pop(); facts.push(`<li><b>${L.weight}<i>lb</i></b><span>this morning</span>${prev?`<small>last ${H.days[prev].weight}</small>`:''}</li>`); }
    if(G.bb!=null) facts.push(`<li><b>${G.bb}</b><span>body battery</span>${G.bbChange!=null?`<small>${G.bbChange>=0?'+':''}${G.bbChange} overnight</small>`:''}</li>`);
    if(G.hrv!=null) facts.push(`<li><b>${Math.round(G.hrv)}<i>ms</i></b><span>HRV</span>${G.hrvStatus?`<small>${esc(String(G.hrvStatus).toLowerCase())}</small>`:''}</li>`);
    if(Y.garmin && Y.garmin.steps!=null) facts.push(`<li><b>${num(Y.garmin.steps)}</b><span>steps yesterday</span></li>`);
    if(G.resp!=null) facts.push(`<li><b>${Math.round(G.resp)}</b><span>breaths / min</span><small>overnight</small></li>`);
    if(facts.length) html += `<ul class="facts">${facts.join('')}</ul>`;
    el.innerHTML = html;
    F('repn').textContent = Object.keys(G).length ? 'last night · from Garmin' : 'last night · from Health';
  }

  // ---- the weather, from Open-Meteo, for wherever the browser says you are (asked once, remembered) ----
  const SKY = c => c===0?'clear':c<=2?'partly cloudy':c===3?'overcast':c<=48?'foggy':c<=57?'drizzling':c<=67?'raining':c<=77?'snowing':c<=82?'showers':c<=86?'snow showers':'thunderstorms';
  async function renderWeather(){
    let geo=null; try{ geo=JSON.parse(localStorage.getItem('hq.geo')); }catch{}
    if(!geo){ if(!navigator.geolocation) return; geo = await new Promise(res=>navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(2), lon:+p.coords.longitude.toFixed(2)}), ()=>res(null), {maximumAge:864e5, timeout:8000})); if(!geo) return; try{ localStorage.setItem('hq.geo', JSON.stringify(geo)); }catch{} }
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1`;
      const w=await (await fetch(u)).json(); const t=Math.round(w.current.temperature_2m), hi=Math.round(w.daily.temperature_2m_max[0]), lo=Math.round(w.daily.temperature_2m_min[0]), rain=w.daily.precipitation_probability_max[0];
      rememberWhere(geo);   // so the nightly sync can keep what the weather actually was, on the days you never opened this
      F('wx').innerHTML = `<span><span class="k">Out</span><b>${t}°</b> <span class="t">and ${SKY(w.current.weather_code)} · ${lo}° to ${hi}°${rain>=30?` · ${rain}% chance of rain`:''}</span></span>`; F('wx').hidden=false;
    }catch{}
  }

  // Where the weather is being asked about, kept once beside the readings it will annotate. Two decimals is
  // about a kilometre — enough for a forecast, not enough to find a house.
  async function rememberWhere(geo){
    if(!geo) return;
    const H = await store.load('health', true).catch(()=>null); if(!H) return;
    const was = H.geo || {};
    if(was.lat === geo.lat && was.lon === geo.lon) return;
    H.geo = { lat: geo.lat, lon: geo.lon };
    store.save('health', H);
  }

  // ---- state of affairs ----
  // One builder per area, each handed the day's documents and returning a row or nothing. Keeping them in a
  // list rather than one long function is what makes the list arrangeable: what shows, and in what order, is
  // a saved choice, and an area added later is on until it is turned off.
  function row(name, href, note, value, unit, flag){
    return `<li><a class="n" href="${href}">${name}</a><span class="d">${note}</span><span class="v ${flag?'flag':''}">${value}<small>${unit}</small></span></li>`;
  }

  const AREAS = [
    { id:'finances', name:'Finances', build(d){
      if(d.fin && !(d.fin.cats||[]).length && !(d.fin.tx||[]).length && !(d.fin.income||[]).length) d.fin = null;   // a month nobody has touched reads as not started
      if(!d.fin) return row('Finances','finances.html','Open Finances to set this month’s budget','','not started');
      const spent=d.fin.tx.reduce((n,t)=>n+t.amt,0), limits=d.fin.cats.reduce((n,c)=>n+c.limit,0), left=limits-spent;
      const landed=(d.fin.income||[]).reduce((n,i)=>n+i.amt,0), cash=landed-spent;   // what is actually left, as the Finances page counts it
      const due=d.fin.cats.find(c=>c.due && (c.bill || !d.fin.tx.some(t=>t.cat===c.id)) && c.due>=C.now.getDate()), next=(d.fin.plan||[]).filter(p=>p.date>=TODAY).sort()[0];
      // one pool hides an overspend: a category can be over while the total still looks healthy
      const over = d.fin.cats.filter(c=>c.limit>0 && d.fin.tx.filter(t=>t.cat===c.id).reduce((n,t)=>n+t.amt,0) > c.limit);
      const overNote = over.length ? `<b class="over">${over.length} over</b> · ${over.map(c=>esc(c.name)).slice(0,2).join(', ')}${over.length>2?'…':''}` : '';
      const note = overNote || (due ? `${esc(due.bill||due.name)} ${due.due===C.now.getDate()?'due today':'due on the '+due.due+ordinal(due.due)}` : next ? `Next paycheck ${C.short(C.fromISO(next.date))}, ${$0(next.amt)}` : `${$0(left)} left of ${$0(limits)} in limits`);
      return row('Finances','finances.html',note,$0(cash),`${$0(landed)} in, ${$0(spent)} out`, due && due.due===C.now.getDate());
    } },

    { id:'investments', name:'Investments', build(d){
      if(!(d.inv && ((d.inv.holdings||[]).length || (d.inv.balances||[]).length))) return null;   // nothing held: nothing to say
      const P=d.inv.prices||{}, px=t=>P[String(t).toUpperCase()];
      const latest={}; [...(d.inv.balances||[])].sort((a,b)=>a.date<b.date?-1:1).forEach(b=>{ latest[b.account]=b.value; });
      const worth=(d.inv.holdings||[]).reduce((n,h)=>n+(px(h.ticker)?h.shares*px(h.ticker).price:0),0)+Object.values(latest).reduce((n,v)=>n+v,0);
      const move=(d.inv.holdings||[]).reduce((n,h)=>{ const p=px(h.ticker); if(!p||p.chg==null) return n; const v=h.shares*p.price; return n+(v-v/(1+p.chg/100)); },0);
      const earn=(d.inv.holdings||[]).reduce((n,h)=>n+(h.yield&&px(h.ticker)?h.shares*px(h.ticker).price*h.yield/100/52:0),0);
      const priced=(d.inv.holdings||[]).some(h=>px(h.ticker));
      return row('Investments','investments.html', priced ? `${move>=0?'Up':'Down'} ${$0(Math.abs(move))} today${earn?` · cash earns ${'$'+earn.toFixed(2)} a week`:''}` : 'No prices yet — Sync now in the bell', $0(worth), 'portfolio', false);
    } },

    { id:'health', name:'Health', build(d){
      if(!d.health) return row('Health','health.html','Nothing logged yet today','0 of 3','logged today');
      const L=d.health, meds=L.meds||0, pills=(L.pills||[]).length, total=meds?4:3, n=['sleep','weight','hr'].filter(k=>L[k]!=null).length+(meds&&pills>=meds?1:0);
      const note = L.sleep ? `Slept ${L.sleep} h${L.hr?' · resting pulse '+L.hr:''}` : 'Nothing logged yet today';
      return row('Health','health.html',note,`${n} of ${total}`,`logged today${meds&&pills<meds?' · '+(meds-pills)+(meds-pills===1?' supplement':' supplements')+' to take':''}`, false);
    } },

    { id:'library', name:'Library', build(d){
      if(!d.lib) return row('Library','library.html','Open Library to shelve your books','','no books yet');
      const b=(d.lib.books||[]).find(x=>x.shelf==='reading'), toread=(d.lib.books||[]).filter(x=>x.shelf==='toread').length;
      return b ? row('Library','library.html',`${esc(b.title)}, ${esc(b.author)}`, b.pages?`p. ${b.page||0}`:'reading', b.pages?`of ${b.pages} · ${Math.round((b.page||0)/b.pages*100)}%`:'', false)
               : row('Library','library.html',`${toread} waiting on the shelf`,'','nothing open');
    } },

    { id:'school', name:'School', build(d){
      if(!d.school) return row('School','school.html','Open School to add your courses','','no courses yet');
      const items=(d.school.items||[]).filter(toDo).sort((a,b)=>a.due<b.due?-1:1), nx=items[0], cn=id=>(d.school.courses||[]).find(c=>c.id===id);
      const dd = nx ? C.daysBetween(TODAY, nx.due) : null;
      const note = nx ? `${esc(cn(nx.course)?.name||'')} — ${esc(nx.title)}, ${dd<0?'overdue':dd===0?'due today':dd===1?'due tomorrow':'due '+C.monthShort(C.fromISO(nx.due))+' '+C.fromISO(nx.due).getDate()}` : 'Nothing due';
      return row('School','school.html',note,`${items.length}`,`open ${items.length===1?'item':'items'}`, dd!==null && dd<=0);
    } },

    { id:'patterns', name:'Patterns', build(d){
      // always here, even before the first finding, or the page it links to cannot be reached at all
      const n=(d.pat && d.pat.shown || []).length, tested=d.pat && d.pat.tested;
      return row('Patterns','patterns.html', n ? 'Things that moved together, worked out overnight' : tested ? 'Nothing has held yet; it looks again every night' : 'Starts once there are thirty days of something',
        n ? String(n) : '—', n ? 'worth a look' : 'nothing yet', false);
    } },

    { id:'study', name:'The Study', build(d){
      const st=d.study, day=st && st.days && st.days[TODAY], titles={stoics:'The Stoics', socrates:'Socrates', sermon:'The Sermon on the Mount'};
      if(!(st && (st.pos>0 || day))) return row('The Study','study.html','Three cards a day, from the Stoics to start','','not begun');
      const done=day && day.done, n=day ? (day.recall?1:0)+day.cards.length : 3, at=day ? Math.min(day.at, n) : 0;
      let run=0; for(let i=0;i<400;i++){ const k=C.iso(C.addDays(C.fromISO(TODAY),-i)); if(st.days[k] && st.days[k].done) run++; else if(i===0) continue; else break; }
      return row('The Study','study.html', `${titles[st.path]||st.path} · card ${Math.min(st.pos+1, st.len||42)} of ${st.len||42}${run>=2?` · ${run} days running`:''}`, done ? 'done' : `${at} of ${n}`, done ? 'today’s cards' : 'cards read today', false);
    } },

    { id:'calendar', name:'Calendar', build(d){
      const list=d.day||[], lastEnd = list.length ? Math.max(...list.map(s=>s.end)) : null;
      const note = !list.length ? 'A clear day' : lastEnd<=NOW ? 'Nothing more today' : `Free after ${h12(lastEnd)}`;
      return row('Calendar','calendar.html',note, `${list.length}`, `${list.length===1?'item':'items'} today`, false);
    } },
  ];

  // what shows and in what order. Kept with the other documents so the arrangement follows you between
  // devices; an area HQ learns later is on until it is turned off, which is why only the hidden ones are named.
  let PREFS = { hidden: [], order: [] };
  const arranged = () => {
    const seen = new Set();
    const first = (PREFS.order || []).map(id => AREAS.find(a => a.id === id)).filter(a => a && !seen.has(a.id) && seen.add(a.id));
    return [...first, ...AREAS.filter(a => !seen.has(a.id))];
  };
  const shown = () => arranged().filter(a => !(PREFS.hidden || []).includes(a.id));

  let LAST = null;
  function renderAffairs(d){
    LAST = d;
    const rows = shown().map(a => { try { return a.build(d); } catch { return null; } }).filter(Boolean);
    F('affairs').innerHTML = rows.join('') || '<li class="empty">Every area is turned off. Arrange the list to bring some back.</li>';
    F('affn').innerHTML = `${C.now.getHours()<12 ? 'this morning' : C.now.getHours()<18 ? 'this afternoon' : 'this evening'} · <a href="review.html">the week</a> · <button class="textbtn" type="button" id="arrange">Arrange</button>`;
    F('arrange').addEventListener('click', openArrange);
  }

  // the arranging itself: what to show, and the order, with the list underneath redrawing as you go
  function openArrange(){
    const box = F('affedit');
    if(!box.hidden){ box.hidden = true; return; }
    box.hidden = false;
    paintArrange();
  }
  function paintArrange(){
    const hidden = new Set(PREFS.hidden || []);
    F('affedit').innerHTML = `<ul class="arrange">${arranged().map((a,i,all)=>`
      <li data-id="${a.id}">
        <input type="checkbox" id="ar-${a.id}" ${hidden.has(a.id)?'':'checked'}>
        <label for="ar-${a.id}">${a.name}</label>
        <button class="mv" type="button" data-up ${i===0?'disabled':''} aria-label="Move ${a.name} up">↑</button>
        <button class="mv" type="button" data-down ${i===all.length-1?'disabled':''} aria-label="Move ${a.name} down">↓</button>
      </li>`).join('')}</ul>
      <p class="arrn">Turned-off areas keep their data; only this list changes. <button class="textbtn" type="button" id="arrdone">Done</button></p>`;
    F('arrdone').addEventListener('click', ()=>{ F('affedit').hidden = true; });
  }
  F('affedit').addEventListener('change', e=>{
    if(e.target.type !== 'checkbox') return;
    const id = e.target.closest('li').dataset.id, hidden = new Set(PREFS.hidden || []);
    e.target.checked ? hidden.delete(id) : hidden.add(id);
    PREFS.hidden = [...hidden]; savePrefs(); renderAffairs(LAST); paintArrange();
  });
  F('affedit').addEventListener('click', e=>{
    const b = e.target.closest('.mv'); if(!b) return;
    const id = b.closest('li').dataset.id, order = arranged().map(a=>a.id), i = order.indexOf(id);
    const j = b.hasAttribute('data-up') ? i-1 : i+1;
    if(j < 0 || j >= order.length) return;
    order.splice(j, 0, order.splice(i, 1)[0]);
    PREFS.order = order; savePrefs(); renderAffairs(LAST); paintArrange();
  });
  const savePrefs = () => { PREFS.doc = hqPrefs.save({ affairs: { hidden: PREFS.hidden, order: PREFS.order } }); };

  const ordinal = n => (n%10===1&&n!==11)?'st':(n%10===2&&n!==12)?'nd':(n%10===3&&n!==13)?'rd':'th';

  // ---- greeting with the insight sentence ----
  function renderUpNext(list){
    const cur=list.find(s=>s.start<=NOW&&s.end>NOW), next=list.filter(s=>s.start>NOW)[0], el=F('upnext'), bits=[];
    if(cur) bits.push(`<span><span class="k">Now</span><b>${esc(cur.title)}</b> <span class="t">· until ${h12(cur.end)}</span></span>`);
    if(next){ const mins=Math.round((next.start-NOW)*60); bits.push(`<span><span class="k">Next</span><b>${esc(next.title)}</b> <span class="t">· ${h12(next.start)}, ${mins<60?'in '+mins+' min':'in '+Math.round(mins/60)+' h'}</span></span>`); }
    else if(cur) bits.push(`<span><span class="k">Then</span>free for the rest of the day</span>`);
    else if(list.length) bits.push(`<span><span class="k">Done</span>nothing more today</span>`);
    el.hidden = !bits.length; el.innerHTML = bits.join('');
  }
  function renderGreeting(d){
    const parts=[];
    // an exam today comes first, with how much studying went into it this week
    const items=d.school ? (d.school.items||[]).filter(toDo) : [];
    const exam=items.find(i=>i.due===TODAY && /exam|test|quiz|midterm|final/i.test(i.title+' '+(i.type||'')));
    if(exam){ const min=(d.school.sessions||[]).filter(s=>s.course===exam.course && C.daysBetween(s.date,TODAY)>=0 && C.daysBetween(s.date,TODAY)<7).reduce((n,s)=>n+s.min,0); parts.push(`${esc(exam.title)} is today${min?` and you have put in ${hrs(min)} this week`:' and you have not studied for it this week'}`); }
    else { const nx=items.sort((a,b)=>a.due<b.due?-1:1)[0]; if(nx){ const dd=C.daysBetween(TODAY,nx.due); if(dd<=2) parts.push(`${esc(nx.title)} is due ${dd<=0?'today':dd===1?'tomorrow':'in two days'}`); } }
    if(d.fin){ const due=d.fin.cats.find(c=>c.due===C.now.getDate()); if(due) parts.push(`${esc((due.bill||due.name).toLowerCase())} wants paying today`); }
    // last night against the week
    if(d.H && d.H.days && d.H.days[TODAY] && d.H.days[TODAY].sleep!=null){ const s=+d.H.days[TODAY].sleep, prev=Object.keys(d.H.days).filter(k=>k<TODAY && +d.H.days[k].sleep>0).sort().slice(-7).map(k=>+d.H.days[k].sleep), avg=prev.length>=3?prev.reduce((a,b)=>a+b)/prev.length:null;
      if(avg && s<avg-0.5) parts.push(`you slept ${s} h, under your week’s ${avg.toFixed(1)}`); else if(s>=7.5) parts.push(`a good ${s} h of sleep`); }
    // supplements, once the evening is here
    if(d.health && d.health.meds && C.now.getHours()>=18){ const left=d.health.meds-(d.health.pills||[]).length; if(left>0) parts.push(`${left} ${left===1?'supplement':'supplements'} still to take`); }
    const s = parts.length ? parts.slice(0,3).join('; ') : 'nothing pressing';
    F('greet').innerHTML = `${C.greeting(C.now)}, Jacob. <em>${s[0].toUpperCase()+s.slice(1)}.</em>`;
  }

  // ---- to do: the home's own document, one per day ----
  const TKEY = 'today.' + TODAY; let T = {items:[]}, CAL = null, d = {};
  const YDAY = C.iso(C.addDays(C.fromISO(TODAY),-1));
  const saveT = () => store.save(TKEY, T);
  function renderTodo(){
    F('reps').innerHTML = (RULES.rules||[]).map(r=>`<li class="${ruleOver(r)?'over':''}"><span>${esc(r.text)}<small>${[repSays(r.rep), r.target&&!r.text.toLowerCase().includes(r.target.unit)?`${r.target.n} ${esc(r.target.unit)}`:'', r.at!=null?`by ${h12(r.at)}`:'', r.until?(ruleOver(r)?`ended ${C.dayMonth(C.fromISO(r.until))}`:`until ${C.dayMonth(C.fromISO(r.until))}`):''].filter(Boolean).join(' · ')}</small></span><button class="textbtn" type="button" data-stop="${r.id}">${ruleOver(r)?'remove':'stop'}</button></li>`).join('');
    const done=T.items.filter(i=>i.done).length;
    F('todon').textContent = T.items.length ? `${done} of ${T.items.length}` : 'nothing yet';
    F('todo').innerHTML = T.items.length ? T.items.map((i,k)=>`<li><input type="checkbox" id="t${k}" ${i.done?'checked':''} data-k="${k}"><label for="t${k}">${esc(i.text)}</label>${i.rule?'<span class="rp" title="comes back on its own">\u21bb</span>':''}${i.target?`<span class="tg"><input class="did" value="${i.did||0}" inputmode="decimal" data-did="${k}" aria-label="How much of ${esc(i.text)} so far"> of ${i.target.n}${i.text.toLowerCase().includes(i.target.unit)?'':' '+esc(i.target.unit)}</span>`:''}${i.at!=null?`<span class="w ${!i.done&&i.at<NOW?'due':''}">by ${h12(i.at)}</span>`:''}${i.from?`<span class="w from">from ${i.from===YDAY?'yesterday':C.short(C.fromISO(i.from))}</span>`:''}${i.rule?`<button class="w skip" type="button" data-skip="${k}">not today</button>`:''}<button class="w x" type="button" data-rm="${k}" aria-label="Remove">remove</button></li>`).join('') : '<li class="empty">Nothing on the list. Add the one thing today needs.</li>';
  }
  F('todo').addEventListener('change', e=>{
    if(e.target.matches('[data-did]')){ const i=T.items[+e.target.dataset.did]; if(!i) return;
      const v=parseFloat(e.target.value); i.did = isNaN(v)||v<=0 ? undefined : v;
      if(i.target && i.did >= i.target.n) i.done = true;    // the target met is the thing done
      saveT(); renderTodo(); d.day=renderDay(CAL); return; }
    if(e.target.type==='checkbox'){ T.items[+e.target.dataset.k].done=e.target.checked; saveT(); renderTodo(); d.day=renderDay(CAL); } });
  // Skipping one day: the instance goes and is remembered as skipped, so posting it again does not undo that.
  // The rule itself is untouched — it comes back tomorrow.
  F('todo').addEventListener('click', e=>{ const sk=e.target.closest('[data-skip]'); if(sk){
      const k=+sk.dataset.skip, it=T.items[k]; if(!it||!it.rule) return;
      const was=hqCopy(T.items), wasSkip=hqCopy(T.skipped||[]);
      T.items.splice(k,1); T.skipped=[...(T.skipped||[]), it.rule]; saveT(); renderTodo(); d.day=renderDay(CAL);
      hqUndo(`${it.text} for today`, ()=>{ T.items=was; T.skipped=wasSkip; saveT(); renderTodo(); d.day=renderDay(CAL); });
      return; }
    const b=e.target.closest('[data-rm]'); if(b){ const was=hqCopy(T.items), gone=T.items[+b.dataset.rm];
    T.items.splice(+b.dataset.rm,1); saveT(); renderTodo();
    hqUndo(gone?gone.text:'the to-do', ()=>{ T.items=was; saveT(); renderTodo(); }); } });
  // "… by 3 pm" / "… at 3.30pm" at the end of a to-do becomes its time; it then sits on the timeline and the bell watches it
  const atFrom = (h1, m2, ap) => { let h=+h1%12; const mm=+(m2||0)/60, a=(ap||'').toLowerCase();
    if(a.startsWith('p')) h+=12; else if(!a && (h+mm<=NOW || +h1===12)) h+=12;   // no am/pm: the next time that clock reading comes round
    return h+mm; };
  const parseAt = t => {
    // "by" and "before" name a deadline whatever else is in the sentence, so they are looked for anywhere;
    // a bare "at" is left at the end, where it cannot be mistaken for the start of an appointment.
    const any = /\b(?:by|before)\s+(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\b/i.exec(t);
    if(any && +any[1] <= 12) return { text: (t.slice(0, any.index) + ' ' + t.slice(any.index + any[0].length)).replace(/\s+/g,' ').trim(), at: atFrom(any[1], any[2], any[3]) };
    const m = /\s(?:by|at)\s+(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\.?$/i.exec(t);
    if(!m || +m[1] > 12) return { text: t };
    return { text: t.slice(0, m.index).trim(), at: atFrom(m[1], m[2], m[3]) };
  };
  const migrateAt = () => { let n=0; T.items.forEach(i=>{ if(i.at==null){ const p=parseAt(i.text); if(p.at!=null){ Object.assign(i,p); n++; } } }); return n; };
  // A target is a number with a unit after it, which nothing else the box reads ever has: money is a bare
  // amount or carries a currency mark, a weight is a bare number. So "read 20 pages" is unambiguous.
  const UNITS_T = 'pages?|minutes?|mins?|hours?|hrs?|km|kilometres?|kilometers?|miles?|sets?|reps?|glasses|cups?|words?|chapters?';
  const UNIT_NAME = u => { const w = u.toLowerCase();
    return /^pages?$/.test(w) ? 'pages' : /^(minutes?|mins?)$/.test(w) ? 'min' : /^(hours?|hrs?)$/.test(w) ? 'h'
      : /^(km|kilomet)/.test(w) ? 'km' : /^miles?$/.test(w) ? 'miles' : /^sets?$/.test(w) ? 'sets'
      : /^reps?$/.test(w) ? 'reps' : /^glasses$/.test(w) ? 'glasses' : /^cups?$/.test(w) ? 'cups'
      : /^words?$/.test(w) ? 'words' : 'chapters'; };
  const takeTarget = t => {
    const m = new RegExp(`\\b(\\d{1,4}(?:\\.\\d{1,2})?)\\s*(${UNITS_T})\\b`, 'i').exec(t);
    if(!m) return { text: t };
    return { text: t, target: { n: +m[1], unit: UNIT_NAME(m[2]) } };   // the phrase is read, not removed
  };

  // An end: a day it stops on, or a stretch from today. Both say when, so both become one date.
  const WORDNUM = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12 };
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const takeUntil = t => {
    const span = /\bfor\s+(?:the\s+next\s+)?(\d{1,3}|a|an|one|two|three|four|five|six|seven|eight|nine|ten|twelve)\s+(days?|weeks?|months?)\b/i.exec(t);
    if(span){
      const n = +span[1] || WORDNUM[span[1].toLowerCase()] || 1;
      const mult = /^week/i.test(span[2]) ? 7 : /^month/i.test(span[2]) ? 30 : 1;
      return { text: (t.slice(0, span.index) + ' ' + t.slice(span.index + span[0].length)).replace(/\s+/g,' ').trim(),
               until: C.iso(C.addDays(C.now, n * mult)) };
    }
    const m = /\b(?:until|till|thru|through|up to)\s+((?:the\s+)?[a-z0-9]+(?:\s+\d{1,2})?)/i.exec(t);
    if(!m) return { text: t };
    const until = untilDate(m[1].trim());
    if(!until) return { text: t };
    return { text: (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).replace(/\s+/g,' ').trim(), until };
  };
  // "December" means the end of it; "the 20th" the next 20th; a weekday the next one of those
  const untilDate = w => {
    const t = w.toLowerCase().replace(/^the\s+/, '');
    const mi = MONTHS.findIndex(x => x === t || x.slice(0,3) === t.slice(0,3));
    if(mi >= 0){ const y = C.now.getFullYear() + (mi < C.now.getMonth() ? 1 : 0); return C.iso(new Date(y, mi + 1, 0, 12)); }
    const nth = /^(\d{1,2})(?:st|nd|rd|th)?$/.exec(t);
    if(nth){ const dd = +nth[1]; if(dd < 1 || dd > 31) return null;
      const now = C.now, m = dd >= now.getDate() ? now.getMonth() : now.getMonth() + 1;
      return C.iso(new Date(now.getFullYear(), m, dd, 12)); }
    try { const d = C.parseDay(t); if(d && d > TODAY) return d; } catch {}
    return null;
  };

  // ---- one sentence, possibly several things ----
  // A capture is split only on a strong signal: a semicolon, or commas when more than one clause carries its
  // own "every …". Splitting on every comma would wreck "Dentist, Tuesday 3 pm", which is one thing.
  // What is said once and belongs to all of them — a deadline — is carried across; that is the nuance a
  // single-clause parser has no way to express.
  const TYPEHINT = /^\s*(to-?\s?dos?|todos?|tasks?|reminders?)\s*[,:]\s*/i;
  const splitCapture = raw => {
    let t = raw.trim(), hint = null;
    const h = TYPEHINT.exec(t); if(h){ hint = 'todo'; t = t.slice(h[0].length); }
    let parts = t.split(/\s*;\s*/).filter(Boolean);
    if(parts.length === 1){
      const commas = t.split(/\s*,\s*(?:and\s+)?|\s+and\s+(?=\S)/).filter(Boolean);
      // two or more clauses each describing how often: that is a list, not one sentence with commas in it
      if(commas.length > 1 && commas.filter(c => REP_RE.test(c)).length > 1) parts = commas;
    }
    return { parts: parts.map(x => x.trim()).filter(Boolean), hint };
  };

  // ---- one box, three meanings ----
  // "12.40 lunch" is money, "173.2" on its own is a weight, anything else is a to-do. A to-do may carry
  // "by 3 pm" (it then sits on the timeline) and "every Monday" (it comes back on its own).
  let RULES = { rules: [] };
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);   // two made in the same millisecond must not share an id
  const saveRules = () => store.save('todo.rules', RULES);
  const DAYNAMES = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  // How often a standing item comes back. Three shapes, and the third is new: 'daily', 'weekdays', a weekday
  // number, or { every: n, from: 'YYYY-MM-DD' } for a period — every other day, every third day. A period needs
  // a starting day or there is no way to know which days are the on ones.
  // The phrase is looked for anywhere in the sentence, not only at its end, since "on every day before 9 pm"
  // puts it in the middle and the old pattern only ever read the tail.
  const REP_RE = /\b(?:on\s+)?every\s+(other\s+day|second\s+day|third\s+day|\d{1,2}\s*(?:nd|rd|th)?\s+days?|day|weekdays?|[a-z]{3,9}day|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)\b/i;
  const takeRep = t => {
    const m = REP_RE.exec(t);
    if(!m) return { text: t };
    const w = m[1].toLowerCase().replace(/\s+/g, ' ').trim();
    let rep = null;
    if(w === 'day') rep = 'daily';
    else if(w === 'weekday' || w === 'weekdays') rep = 'weekdays';
    else if(w === 'other day' || w === 'second day') rep = { every: 2, from: TODAY };
    else if(w === 'third day') rep = { every: 3, from: TODAY };
    else { const n = /^(\d{1,2})/.exec(w);
      if(n && +n[1] >= 1) rep = +n[1] === 1 ? 'daily' : { every: +n[1], from: TODAY };
      else { const i = DAYNAMES.findIndex(d => d === w || d.slice(0,3) === w.slice(0,3)); if(i >= 0) rep = i; } }
    if(rep === null) return { text: t };
    return { text: (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim(), rep };
  };
  const parseRep = takeRep;   // the old name, kept where it is still called
  const everyWord = n => n === 2 ? 'other' : n === 3 ? 'third' : n === 4 ? 'fourth' : `${n}th`;
  const repSays = rep => rep && rep.every ? (rep.every === 2 ? 'every other day' : `every ${everyWord(rep.every)} day`)
    : rep === 'daily' ? 'every day' : rep === 'weekdays' ? 'every weekday' : `every ${DAYNAMES[rep][0].toUpperCase()}${DAYNAMES[rep].slice(1)}`;
  const repToday = rep => {
    if(rep && rep.every) { const n = C.daysBetween(rep.from || TODAY, TODAY); return n >= 0 && n % rep.every === 0; }
    const wd = C.now.getDay();
    return rep === 'daily' || (rep === 'weekdays' && wd >= 1 && wd <= 5) || rep === wd;
  };
  // a standing item joins the day it belongs to, once — unless it has run out, or you skipped today
  const ruleOver = r => r.until && TODAY > r.until;
  const postRules = () => { let n = 0;
    for(const r of RULES.rules || []){
      if(!repToday(r.rep) || ruleOver(r)) continue;
      if((T.skipped || []).includes(r.id)) continue;
      if(T.items.some(i => i.rule === r.id)) continue;
      T.items.push({ text: r.text, at: r.at, done: false, rule: r.id, target: r.target }); n++;
    }
    return n; };

  // ---- an appointment, told apart from a to-do by having a span or a day of its own ----
  // "Dentist 3–4 pm" and "Coffee Thursday at 10" are appointments; "Call the dentist by 3 pm" stays a to-do,
  // because "by" is a deadline and a to-do belongs to today. Nothing that used to be a to-do becomes an event.
  const DAYWORDS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const hourOf = (h, m, ap, ref) => { let n = +h % 12; if (ap && ap[0].toLowerCase() === 'p') n += 12;
    else if (!ap && n + (+m || 0) / 60 < (ref != null ? ref : 7)) n += 12;   // no am/pm: the reading that is still to come
    return n + (+m || 0) / 60; };

  // a day named in the text — today, tomorrow, a weekday, or "17 Oct" — taken out of it
  const tidy = x => x.replace(/\s+/g, ' ').replace(/^[\s,:;–—-]+|[\s,:;–—-]+$/g, '').trim();
  function parseDayWord(raw){
    const t = ' ' + String(raw).trim();
    const dm = /\s(today|tonight|tomorrow|tmrw|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.exec(t)
            || /\s(\d{1,2}\s+[A-Za-z]{3,9}|[A-Za-z]{3,9}\s+\d{1,2})(?:\b|$)/.exec(t);
    if(!dm) return null;
    const w = dm[1].toLowerCase();
    let date = null;
    if(w === 'today' || w === 'tonight') date = TODAY;
    else if(w === 'tomorrow' || w === 'tmrw') date = C.iso(C.addDays(C.now, 1));
    else { const i = DAYWORDS.findIndex(n => n.startsWith(w.slice(0, 3)));
      if(i >= 0){ let n = (i - C.now.getDay() + 7) % 7; if(!n) n = 7; date = C.iso(C.addDays(C.now, n)); }   // "Thursday" means the next one
      else { const guess = C.parseDay(dm[1]); if(guess && guess !== TODAY) date = guess; } }
    if(!date) return null;
    return { date, said: dm[1], text: tidy(t.slice(0, dm.index) + ' ' + t.slice(dm.index + dm[0].length)) };
  }

  function parseWhen(raw){
    // "by" names a deadline, which is a to-do however much else is in the line
    if(/\bby\s+\d/i.test(raw)) return null;
    let t = ' ' + raw.trim(), date = null, said = null;
    const dw = parseDayWord(raw);
    if(dw && dw.date){ date = dw.date; said = dw.said; t = ' ' + dw.text; }
    // a span: "3–4 pm", "3 to 4.30", "9.15-10"
    let start = null, end = null;
    const UNITS = /^\s*(km|mi|miles?|k|pages?|pp|reps?|sets?|kg|lbs?|pounds?|people|minutes?|mins?|days?|weeks?|months?|years?|%|dollars?)\b/i;
    const span = /\s(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until|till)\s*(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)?\b/i.exec(t);
    // a span is only a span of time: with no am or pm both ends must read as a clock, and a unit right after it
    // means it was a count all along — "pages 10 to 20", "5 to 10 km"
    const spanIsClock = span && (span[3] || span[6] || (+span[1] >= 1 && +span[1] <= 12 && +span[4] >= 1 && +span[4] <= 12))
      && !UNITS.test(t.slice(span.index + span[0].length));
    if(spanIsClock){
      end = hourOf(span[4], span[5], span[6] || span[3]);
      start = hourOf(span[1], span[2], span[3] || span[6], end);
      if(end <= start) end = Math.min(24, start + 1);
      t = t.slice(0, span.index) + ' ' + t.slice(span.index + span[0].length);
    } else {
      // a single time, with "at" or a named day, and perhaps a length: "at 3 pm for 45 min"
      const one = /\s(?:at|@)\s*(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)?\b/i.exec(t) || (date ? /\s(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)\b/i.exec(t) : null);
      if(one){
        start = hourOf(one[1], one[2], one[3]);
        t = t.slice(0, one.index) + ' ' + t.slice(one.index + one[0].length);
        const len = /\sfor\s+(?:(half)\s+)?(?:(an?)\s+)?(\d+(?:\.\d+)?)?\s*(hours?|hrs?|h|minutes?|mins?|m)\b/i.exec(t);
        if(len){ const n = len[1] ? 0.5 : len[2] ? 1 : +(len[3] || 1); end = start + (/^h/i.test(len[4]) ? n : n / 60);
          t = t.slice(0, len.index) + ' ' + t.slice(len.index + len[0].length); }
        else end = start + 1;
      }
    }
    if(start == null) return null;                       // no time at all: not an appointment
    if(!span && !date) return null;                      // a bare "at 3" today is a to-do, as it always was
    const title = tidy(t.replace(/\s+(on|at|from)$/i, ''));
    if(!title) return null;
    return { title, date: date || TODAY, start, end: Math.min(24, end), said };
  }

  const money = s => { const m = /^\$?(\d{1,6}(?:,\d{3})*(?:\.\d{2}))\b/.exec(s.trim()) || /\$(\d{1,6}(?:,\d{3})*(?:\.\d{1,2})?)\b/.exec(s); return m ? +m[1].replace(/,/g,'') : null; };
  const whatOf = s => s.replace(/^\$?\d[\d,]*(?:\.\d{2})?\s*/, '').replace(/\$\d[\d,]*(?:\.\d{1,2})?/, '').replace(/^(on|for|at)\s+/i,'').trim();
  // a category is not guessed from thin air: it is the one this description went to last time
  const catFor = (what, fin) => { const w = what.toLowerCase();
    const prev = (fin.tx || []).filter(t => t.what && t.cat).reverse().find(t => t.what.toLowerCase() === w) ||
                 (fin.tx || []).filter(t => t.what && t.cat).reverse().find(t => t.what.toLowerCase().includes(w) || w.includes(t.what.toLowerCase()));
    if(prev) return prev.cat;
    const named = (fin.cats || []).find(c => w.includes(c.name.toLowerCase()));
    return named ? named.id : '';
  };

  function said(text){ const el = F('saidt'); el.textContent = text; el.hidden = false; clearTimeout(said.t); said.t = setTimeout(() => { el.hidden = true; }, 6000); }

  // What a capture would make, as a list. Nothing is written here.
  function planCapture(raw){
    const { parts, hint } = splitCapture(raw);
    if(parts.length < 2) return null;                       // one thing: the ordinary path handles it
    const plans = parts.map(part => {
      const r = takeRep(part), u = takeUntil(r.text), g = takeTarget(u.text);
      const p = parseAt(g.text);
      return { text: tidy(p.text), at: p.at, rep: r.rep, target: g.target, until: u.until };
    });
    const anyUntil = plans.find(x => x.until);                 // an end said once belongs to all of them too
    if(anyUntil) plans.forEach(x => { if(!x.until) x.until = anyUntil.until; });
    const anyAt = plans.find(x => x.at != null);            // a time said once belongs to all of them
    if(anyAt) plans.forEach(x => { if(x.at == null) x.at = anyAt.at; });
    if(hint === 'todo') plans.forEach(x => { x.kind = 'todo'; });
    return plans.every(x => x.text) ? plans : null;
  }

  function makePlanned(plans){
    for(const x of plans){
      if(x.rep != null){
        const id = uid('r');
        (RULES.rules ??= []).push({ id, text: x.text, at: x.at, rep: x.rep, target: x.target, until: x.until });
        if(repToday(x.rep) && !T.items.some(i => i.rule === id)) T.items.push({ text: x.text, at: x.at, done: false, rule: id, target: x.target });
      } else T.items.push({ text: x.text, at: x.at, done: false, target: x.target });
    }
    saveRules(); saveT(); renderTodo(); d.day = renderDay(CAL);
    return plans.length;
  }

  // the proposal: what it read, before anything is written
  function proposeCapture(raw, plans){
    const box = F('propose');
    box.hidden = false;
    box.innerHTML = `<p class="pq">More than one thing in that. Make them?</p><ul>${plans.map(x => `<li><span class="t">${esc(x.text)}</span><span class="w">${[x.rep != null ? repSays(x.rep) : 'today', x.target ? `${x.target.n} ${x.target.unit}` : '', x.at != null ? 'by ' + h12(x.at) : '', x.until ? 'until ' + C.dayMonth(C.fromISO(x.until)) : ''].filter(Boolean).join(' · ')}</span></li>`).join('')}</ul>
      <p class="pa"><button class="textbtn" type="button" id="pyes">Yes, make ${plans.length}</button><button class="textbtn" type="button" id="pno">No, just one to-do</button></p>`;
    F('pyes').addEventListener('click', () => { const n = makePlanned(plans); box.hidden = true; F('t-text').value = ''; said(`Made ${n} standing to-dos`); });
    F('pno').addEventListener('click', () => { box.hidden = true; F('t-text').value = ''; capture(raw, true); });
  }

  async function capture(raw, asOne){
    const t = raw.trim(); if(!t) return;
    if(!asOne){ const plans = planCapture(t); if(plans){ proposeCapture(t, plans); return; } }
    // money
    const amt = money(t);
    if(amt != null && amt > 0){
      const what = whatOf(t) || 'Something';
      const fin = d.fin || (d.fin = { expected: 0, income: [], plan: [], cats: [], tx: [], history: [] });
      const cat = catFor(what, fin);
      fin.tx = fin.tx || []; fin.tx.push({ id: uid('t'), date: TODAY, what: what[0].toUpperCase() + what.slice(1), cat, amt });
      store.save('finances.' + YM, fin);
      const cname = (fin.cats || []).find(c => c.id === cat);
      said(`$${amt.toFixed(2)} logged${cname ? ` to ${cname.name}` : ', with no category yet'} · Finances`);
      renderAffairs(d); return;
    }
    // a weight, on its own
    const wt = /^\d{2,3}(?:\.\d)?$/.test(t) ? +t : null;
    if(wt != null && wt >= 60 && wt <= 500){
      const H = d.H || (d.H = { days: {}, meds: [], next: [] }); H.days ??= {};
      (H.days[TODAY] ??= { pills: [] }).weight = String(wt);
      store.save('health', H); said(`${wt} lb logged · Health`); renderAffairs(d); return;
    }
    // an appointment
    const when = parseWhen(t);
    if(when){
      const cal = CAL || (CAL = { cats: [{id:'cal', name:'Appointments', tint:'#E9EEF3'}], series: [], notes: {}, hidden: [] });
      cal.series ??= []; cal.cats ??= [];
      const named = (cal.cats || []).find(c => c.name && when.title.toLowerCase().includes(c.name.toLowerCase().replace(/s$/, '')));
      cal.series.push({ id: uid('c'), title: when.title, date: when.date, start: when.start, end: when.end, cat: (named || {}).id || 'cal', rep: [], sub: '' });
      store.save('calendar', cal);
      store.sync('calpush');                             // and on to Google, if that is switched on
      said(`“${when.title}” on ${when.date === TODAY ? 'today' : C.dayMonth(C.fromISO(when.date))} at ${h12(when.start)} · Calendar`);
      d.day = renderDay(cal); return;
    }
    // a to-do, which may repeat, may carry a time, and may belong to another day
    const r = parseRep(t);
    if(r.rep != null){ const u = takeUntil(r.text), g = takeTarget(u.text); const p = parseAt(g.text); p.text = tidy(p.text);
      const id = uid('r'); (RULES.rules ??= []).push({ id, text: p.text, at: p.at, rep: r.rep, target: g.target, until: u.until }); saveRules();
      if(repToday(r.rep) && !ruleOver({ until: u.until })) T.items.push({ text: p.text, at: p.at, done: false, rule: id, target: g.target });
      said(`“${p.text}” will come back ${repSays(r.rep)}${g.target ? `, ${g.target.n} ${g.target.unit} a time` : ''}${u.until ? `, until ${C.dayMonth(C.fromISO(u.until))}` : ''}`);
      saveT(); renderTodo(); d.day = renderDay(CAL); return;
    }
    const dw = parseDayWord(r.text);
    const g0 = takeTarget(dw ? dw.text : r.text);
    const p = parseAt(g0.text);
    p.text = tidy(p.text);
    if(g0.target) p.target = g0.target;
    if(dw && dw.date !== TODAY){                      // a day of its own: it waits in that day's list
      const key = 'today.' + dw.date;
      const doc = (await store.load(key)) || { items: [] };
      doc.items ??= []; doc.items.push({ ...p, done: false });
      store.save(key, doc);
      said(`“${p.text}” on ${C.dayMonth(C.fromISO(dw.date))}${p.at != null ? ` by ${h12(p.at)}` : ''} — it will be waiting`);
      return;
    }
    T.items.push({ ...p, done: false });
    saveT(); renderTodo(); d.day = renderDay(CAL);
  }
  F('addt').addEventListener('submit', e=>{ e.preventDefault(); const t=F('t-text').value.trim(); if(!t) return; F('addt').reset(); capture(t); });
  F('reps').addEventListener('click', e=>{ const b=e.target.closest('[data-stop]'); if(!b) return;
    const id=b.dataset.stop, wasR=hqCopy(RULES.rules||[]), goneR=(RULES.rules||[]).find(r=>r.id===id);
    RULES.rules=(RULES.rules||[]).filter(r=>r.id!==id); saveRules();
    hqUndo(goneR?goneR.text:'the standing to-do', ()=>{ RULES.rules=wasR; saveRules(); renderTodo(); });
    T.items=T.items.filter(i=>i.rule!==id); saveT(); renderTodo(); d.day=renderDay(CAL); });

  window.onTodoChange = doc => { T = doc; renderTodo(); d.day = renderDay(CAL); };   // a tick in the bell shows here at once
  // ---- load everything the other pages keep, then draw ----
  (async () => {
    const [cal, fin, H, lib, school, today, inv, study, pat, prefs] = await Promise.all([store.load('calendar'), store.load('finances.'+YM), store.load('health'), store.load('library'), store.load('school'), store.load(TKEY), store.load('investments'), store.load('study'), store.load('patterns'), store.load('prefs')]);
    if(prefs){ PREFS = { doc: prefs, hidden: (prefs.affairs||{}).hidden || [], order: (prefs.affairs||{}).order || [] }; }   // how this list was last arranged
    RULES = (await store.load('todo.rules')) || { rules: [] }; RULES.rules ??= [];
    if(today){ T = today; if(migrateAt()) saveT(); }
    else {   // first look at a new day: unfinished items from the last few days come along, marked
      for(let i=1;i<=3 && !T.items.length;i++){ const k=C.iso(C.addDays(C.fromISO(TODAY),-i)), prev=await store.load('today.'+k); if(prev && prev.items){ T.items = prev.items.filter(x=>!x.done && !x.rule).map(x=>({text:x.text, done:false, from:x.from||k})); break; } }
      if(T.items.length) saveT();
    }
    if(postRules()) saveT();   // the standing items join the day, once
    const health = H && H.days ? Object.assign({meds:(H.meds||[]).length}, H.days[TODAY] || {pills:[]}) : null;
    Object.assign(d, { fin, health, lib, school, H, inv, study, pat }); CAL = cal;
    renderReport(H);
    d.day = renderDay(cal);
    renderAffairs(d); renderGreeting(d); renderUpNext(d.day); renderTodo(); renderWeather();
    C.countIn('.affairs .v, .rep .big b, .rep .facts b');
    // the now line, "in 40 min" and the live event move with the clock
    setInterval(() => { const n=new Date(); if(C.iso(n)!==TODAY){ location.reload(); return; } NOW = n.getHours()+n.getMinutes()/60; d.day = renderDay(cal); renderAffairs(d); renderUpNext(d.day); }, 60000);
    F('foot').textContent = store.signedOut ? 'Showing this browser’s copy. Sign in on the welcome page to sync.' : 'Everything here is read from the other pages; only the to-do list lives on Today.';
  })();
</script>
