<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HQ — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --band:#1F3A2E; --band-ink:#F2ECDF; --band-muted:#B9C9BE;
    --paper:#F5F0E6; --paper-2:#EDE6D8; --tint:#E9E1D0; --ink:#1E1B16; --ink-2:#4D463C; --ink-3:#6A6256; --rule:#D3C9B6; --ox:#7A2E2B;
    --serif:"Libre Caslon Text",Georgia,serif; --sans:"Figtree",system-ui,sans-serif; --card:#FFFDF9; --shadow:0 1px 2px rgba(30,27,22,.05), 0 6px 18px -6px rgba(30,27,22,.12); --a-cal:#E9EEF3; --a-fit:#F6E6DC; --a-health:#F5E4E6; --a-study:#ECE6F3; --hour:44px;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:oldstyle-nums tabular-nums}
  ::selection{background:var(--band);color:var(--band-ink)}
  :focus-visible{outline:2px solid var(--ox);outline-offset:3px}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit;background:none;border:0;padding:0}
  button{cursor:pointer}
  [hidden]{display:none!important}
  h1,h2{font-family:var(--serif);font-weight:400;margin:0}
  .ic{width:16px;height:16px;flex:none}

  .band{background:var(--band);color:var(--band-ink)}
  .band .in{max-width:1180px;margin:0 auto;padding:16px 40px 22px}
  .row{display:flex;align-items:center;gap:26px}
  .mark{font-family:var(--serif);font-size:20px;letter-spacing:.14em;font-weight:700}
  .date{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--band-muted)}
  nav{display:flex;gap:20px;font-size:13.5px;letter-spacing:.04em;color:var(--band-muted);margin-left:10px}
  nav a:hover{color:var(--band-ink)}
  nav a[aria-current]{color:var(--band-ink);border-bottom:1px solid var(--band-ink);padding-bottom:2px}
  .row .right{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:13.5px}
  .textbtn{display:inline-flex;align-items:center;gap:8px;letter-spacing:.04em;border-bottom:1px solid transparent;transition:border-color .15s;white-space:nowrap}
  .textbtn:hover{border-color:currentColor}
  .ib{color:var(--band-muted)} .ib:hover{color:var(--band-ink)}
  .menu{display:none}
  .mast{margin-top:20px;padding-top:18px;border-top:1px solid rgba(242,236,223,.28)}
  h1{font-size:32px;line-height:1.3;text-wrap:balance;max-width:40ch}
  h1 em{font-style:italic}

  main{max-width:1180px;margin:0 auto;padding:34px 40px 44px;display:grid;grid-template-columns:1.1fr 1fr;gap:64px}
  h2{font-size:22px;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:4px;display:flex;align-items:baseline;gap:12px}
  h2 small{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-left:auto}
  ul{list-style:none;margin:0;padding:0}

  /* hour-ruled timeline (clean's donation, in ink and paper) */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 20px;margin-top:14px}
  .tl{position:relative;height:calc(var(--hour) * 12)}
  .hr{position:absolute;left:0;right:0;display:flex;gap:14px;align-items:flex-start;font-family:var(--serif);font-size:13px;color:var(--ink-3)}
  .hr::after{content:"";flex:1;border-top:1px solid var(--rule);transform:translateY(9px)}
  .hr span{width:42px;text-align:right}
  .ev{position:absolute;left:60px;right:0;min-height:30px;background:var(--c);border-radius:10px;padding:6px 12px;font-size:14.5px;line-height:1.3;transition:transform .15s,box-shadow .15s}
  .ev:hover{transform:translateX(2px);box-shadow:var(--shadow)}
  .ev.cal{--c:var(--a-cal)} .ev.fit{--c:var(--a-fit)} .ev.health{--c:var(--a-health)} .ev.study{--c:var(--a-study)}
  .ev b{display:block;font-family:var(--serif);font-weight:400}
  .ev small{color:var(--ink-3);font-size:12.5px}
  .now{position:absolute;left:46px;right:0;height:0;border-top:1.5px solid var(--ox);z-index:2;pointer-events:none}
  .now::after{content:attr(data-t);position:absolute;right:0;top:-21px;font-family:var(--serif);font-size:12px;color:var(--band-ink);background:var(--ox);padding:2px 8px;border-radius:6px}
  .ev.live b{color:var(--ox)}
  .card.clear{padding:34px 28px 32px;text-align:center}
  .card.clear b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:22px;margin-bottom:6px}
  .card.clear small{color:var(--ink-3);font-size:13px}
  .card.clear a{border-bottom:1px solid var(--rule)} .card.clear a:hover{border-color:var(--ink)}
  .upnext{margin:10px 0 0;font-size:14px;color:var(--band-muted);display:flex;flex-wrap:wrap;gap:6px 22px}
  .upnext .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-ink);margin-right:8px}
  .upnext b{font-family:var(--serif);font-weight:400;color:var(--band-ink)}
  .upnext .t{white-space:nowrap}

  /* morning report: last night and the body, read from Health */
  .report{margin-top:34px}
  .rep{display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:start}
  .rep .big{grid-row:1/3}
  .rep .big b{display:block;font-family:var(--serif);font-weight:400;font-size:46px;line-height:1;letter-spacing:-.01em}
  .rep .big b i{font-style:normal;font-size:18px;color:var(--ink-3);margin-left:4px}
  .rep .big span{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
  .rep .big small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .rep .stages{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--paper-2);margin-top:8px}
  .rep .stages i{display:block;height:100%}
  .rep .stages .deep{background:var(--band)} .rep .stages .light{background:#7F9C8C} .rep .stages .rem{background:#C9B8DB} .rep .stages .awake{background:var(--rule)}
  .rep .legend{font-size:12px;color:var(--ink-3);margin-top:6px}
  .rep .legend b{font-weight:500;color:var(--ink-2)}
  .rep .facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;margin-top:12px;padding-top:14px;border-top:1px dotted var(--rule)}
  .rep .facts li b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1;display:block}
  .rep .facts li b i{font-style:normal;font-size:13px;color:var(--ink-3);margin-left:3px}
  .rep .facts li span{display:block;font-size:12.5px;color:var(--ink-2)}
  .rep .facts li small{display:block;font-size:12px;color:var(--ink-3)}
  .rep.empty{display:block;text-align:center;padding:28px 24px}
  .rep.empty b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:19px;margin-bottom:4px}
  .rep.empty small{color:var(--ink-3);font-size:13px}
  .rep.empty a{border-bottom:1px solid var(--rule)} .rep.empty a:hover{border-color:var(--ink)}

  .affairs li{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:baseline}
  .affairs .n{grid-column:1;grid-row:1;font-family:var(--serif);font-size:17px;border-bottom:1px solid transparent}
  .affairs .n:hover{border-bottom-color:var(--ink)}
  .affairs .d{grid-column:1;grid-row:2;color:var(--ink-2);font-size:13.5px}
  .affairs .v{grid-column:2;grid-row:1/3;font-family:var(--serif);font-size:24px;text-align:right;line-height:1.1}
  .affairs .v small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px}
  .affairs .v.flag small{color:var(--ox)}
  .todo{margin-top:34px}
  .todo li{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dotted var(--rule)}
  .todo input[type=checkbox]{appearance:none;width:15px;height:15px;border:1px solid var(--ink-2);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--paper);border-radius:2px}
  .todo input[type=checkbox]:checked{background:var(--band);border-color:var(--band)}
  .todo input[type=checkbox]:checked::after{content:"";width:7px;height:4px;border:1.5px solid var(--band-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
  .todo label{cursor:pointer;flex:1}
  .todo input[type=checkbox]:checked + label{color:var(--ink-3);text-decoration:line-through}
  .todo .w{font-size:12.5px;color:var(--ink-3)}
  .todo .w.due{color:var(--ox)}
  .todo .x{opacity:0} .todo li:hover .x,.todo li:focus-within .x{opacity:1} .todo .x:hover{color:var(--ox)}
  .addt{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;align-items:baseline}
  .addt input{width:100%;font-family:var(--serif);font-size:15px;border-bottom:1px dotted var(--ink-2);padding:2px 0}
  .addt input:focus{outline:none;border-bottom-color:var(--ink)}
  .addt input::placeholder{color:var(--ink-3);font-style:italic}
  .addt .textbtn{font-size:13.5px}
  .hr span{width:46px}
  .ev{left:64px} .now{left:50px}
  .ev.cal,.ev.fit,.ev.health,.ev.study{}
  .foot{max-width:1180px;margin:0 auto;padding:0 40px 32px;font-size:12.5px;color:var(--ink-3);font-style:italic;font-family:var(--serif)}

  @media (prefers-reduced-motion:reduce){.ev{transition:none}}
  @media (max-width:900px){
    .band .in{padding:14px 20px 20px} .date{display:none} .row{flex-wrap:wrap;gap:14px} .menu{display:grid;place-items:center;width:32px;height:32px;color:var(--band-ink)} nav{display:none;order:9;width:100%;flex-wrap:wrap;gap:10px 18px;margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(242,236,223,.28)} .band.nav-open nav{display:flex} h1{font-size:26px}
    main{grid-template-columns:1fr;gap:36px;padding:24px 20px 36px} .card{padding:12px 10px 14px} .card.rep,.card.clear{padding:18px 16px 20px} .rep{grid-template-columns:1fr} .rep .big{grid-row:auto} .rep .stages{margin-top:2px} .rep .facts{grid-template-columns:repeat(2,1fr)} .foot{padding:0 20px 28px}
  }
</style>
</head>
<body>
<header class="band">
  <div class="in">
    <div class="row">
      <a class="mark" href="today.html">HQ</a>
      <span class="date"></span>
      <nav aria-label="Areas"><a href="today.html" aria-current="page">Today</a><a href="calendar.html">Calendar</a><a href="finances.html">Finances</a><a href="library.html">Library</a><a href="school.html">School</a><a href="health.html">Health</a></nav>
      <div class="right">
        <a class="textbtn" href="calendar.html"><svg class="ic"><use href="icons.svg#plus"/></svg>New entry</a>
        <button class="ib" aria-label="Search"><svg class="ic"><use href="icons.svg#search"/></svg></button>
        <button class="ib" aria-label="Notifications"><svg class="ic"><use href="icons.svg#bell"/></svg></button>
        <button class="ib menu" type="button" aria-label="Menu" aria-expanded="false" id="menubtn"><svg class="ic"><use href="icons.svg#menu"/></svg></button>
      </div>
    </div>
    <div class="mast"><h1 id="greet">Good morning, Jacob.</h1><p class="upnext" id="upnext" hidden></p></div>
  </div>
</header>

<main>
  <section>
    <h2>The day<small id="dayn"></small></h2>
    <div class="card"><div class="tl" id="tl"></div></div>
    <div class="report">
      <h2>Morning report<small id="repn"></small></h2>
      <div class="card rep" id="rep"></div>
    </div>
  </section>

  <section>
    <h2>State of affairs<small id="affn"></small></h2>
    <ul class="affairs" id="affairs"></ul>

    <div class="todo">
      <h2>To do<small id="todon"></small></h2>
      <ul id="todo"></ul>
      <form class="addt" id="addt"><input id="t-text" placeholder="Add something for today" required><button class="textbtn" type="submit"><svg class="ic"><use href="icons.svg#plus"/></svg>Add</button></form>
    </div>
  </section>
</main>
<p class="foot" id="foot"></p>

<script src="clock.js"></script>
<script src="store.js"></script>
<script src="bell.js"></script>
<script>
  // Today is a summary: it reads the other pages' documents and derives everything. Only the to-do list is its own.
  const C = clock, F = id => document.getElementById(id), TODAY = C.today;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const h12 = h => { const hr=Math.floor(h), m=Math.round((h%1)*60); return `${hr%12||12}.${String(m).padStart(2,'0')} ${hr<12?'am':'pm'}`; };
  const hrs = m => m>=60 ? (m%60 ? `${Math.floor(m/60)} h ${m%60}` : `${m/60} h`) : `${m} min`;
  const $0 = n => (n<0?'−':'') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
  let NOW = C.now.getHours() + C.now.getMinutes()/60;
  const wd = d => (C.fromISO(d).getDay()+6)%7;
  const YM = TODAY.slice(0,7);

  // ---- the day: from the calendar document ----
  function renderDay(cal){
    const tl = F('tl'); let html='', list=[];
    if(cal && cal.series){
      const isWeekly = s => (s.rep||[]).length>0, repDays = s => [...new Set([wd(s.date), ...(s.rep||[])])];
      const occurs = s => isWeekly(s) ? (TODAY>=s.date && repDays(s).includes(wd(TODAY))) : s.date===TODAY;
      list = cal.series.filter(s=>s.date && occurs(s) && !(cal.hidden||[]).includes(s.cat)).sort((a,b)=>a.start-b.start);
    }
    // 8 to 8, stretched when the day has something earlier or later
    const H0=Math.min(8, ...list.map(s=>Math.floor(s.start))), H1=Math.max(20, ...list.map(s=>Math.ceil(s.end)));
    tl.style.height=`calc(var(--hour) * ${H1-H0})`;
    for(let h=H0; h<H1; h++) html += `<div class="hr" style="top:calc(var(--hour)*${h-H0})"><span>${C.hourLabel(h)}</span></div>`;
    if(cal && cal.series){
      const cats = cal.cats||[], cat = id => cats.find(c=>c.id===id) || {tint:'#E9EEF3'};
      html += list.map(s=>`<a href="calendar.html" class="ev ${s.start<=NOW&&s.end>NOW?'live':''}" style="--c:${cat(s.cat).tint};top:calc(var(--hour)*${s.start-H0} + 9px);height:calc(var(--hour)*${s.end-s.start} - 4px)"><b>${esc(s.title)}</b>${s.end-s.start>=0.75&&s.sub?`<small>${esc(s.sub)}</small>`:''}</a>`).join('');
    }
    if(NOW>=H0 && NOW<=H1) html += `<div class="now" style="top:calc(var(--hour)*${NOW-H0} + 9px)" data-t="${C.time(new Date())}"></div>`;
    const card = tl.parentElement; card.classList.toggle('clear', !list.length); card.querySelector('.clearmsg')?.remove();
    tl.hidden = !list.length; tl.innerHTML = html;
    if(!list.length) card.insertAdjacentHTML('beforeend', `<div class="clearmsg"><b>A clear day.</b><small>Nothing on the calendar · <a href="calendar.html">plan it</a></small></div>`);
    F('dayn').textContent = cal ? (list.length ? `${list.length} ${list.length===1?'item':'items'} · ${C.hourLabel(H0)} to ${C.hourLabel(H1)}` : C.time(new Date())) : 'open Calendar to plan the day';
    return list;
  }

  // ---- morning report: last night and the body, from the Health document ----
  const hm = sec => { const m=Math.round(sec/60); return m>=60 ? `${Math.floor(m/60)} h${m%60?' '+(m%60):''}` : `${m} min`; };
  const num = n => Number(n).toLocaleString('en-US');
  function renderReport(H){
    const el=F('rep'), L=H && H.days && H.days[TODAY] || {}, G=L.garmin||{}, Y=H && H.days && H.days[C.iso(C.addDays(C.fromISO(TODAY),-1))] || {};
    const had = L.sleep!=null || L.hr!=null || L.weight!=null;
    if(!had){ el.className='card rep empty'; el.innerHTML = `<b>Nothing from last night yet.</b><small>${H ? 'Sync Garmin or log it on <a href="health.html">Health</a>.' : 'Open <a href="health.html">Health</a> to start logging.'}</small>`; F('repn').textContent=''; return; }
    el.className='card rep'; let html='';
    if(L.sleep!=null){
      const sum=(G.deep||0)+(G.light||0)+(G.rem||0)+(G.awake||0);
      html += `<div class="big"><b>${L.sleep}<i>h</i></b><span>asleep${G.nap?` · ${hm(G.nap)} nap`:''}</span><small>${[L.bed&&L.woke?`${L.bed} to ${L.woke}`:'', G.score!=null?`score ${G.score}`:''].filter(Boolean).join(' · ')}</small></div>`;
      if(sum){ const seg=(k,v)=>v?`<i class="${k}" style="flex:${v}"></i>`:''; html += `<div><div class="stages">${seg('deep',G.deep)}${seg('light',G.light)}${seg('rem',G.rem)}${seg('awake',G.awake)}</div><p class="legend">${[G.deep&&`<b>${hm(G.deep)}</b> deep`,G.light&&`<b>${hm(G.light)}</b> light`,G.rem&&`<b>${hm(G.rem)}</b> REM`,G.awake&&`<b>${hm(G.awake)}</b> awake`].filter(Boolean).join(' · ')}</p></div>`; }
      else html += `<div><p class="legend" style="margin-top:14px">${G.feedback ? esc(String(G.feedback).replace(/_/g,' ').toLowerCase()) : 'Logged by hand'}</p></div>`;
    } else html += `<div class="big"><b>—</b><span>no sleep logged</span></div><div></div>`;
    const facts=[];
    if(L.hr!=null) facts.push(`<li><b>${L.hr}<i>bpm</i></b><span>resting</span>${G.hr7?`<small>7-day ${Math.round(G.hr7)}</small>`:''}</li>`);
    if(L.weight!=null){ const prev=Object.keys(H.days).filter(d=>d<TODAY && H.days[d].weight!=null).sort().pop(); facts.push(`<li><b>${L.weight}<i>lb</i></b><span>this morning</span>${prev?`<small>last ${H.days[prev].weight}</small>`:''}</li>`); }
    if(G.bb!=null) facts.push(`<li><b>${G.bb}</b><span>body battery</span>${G.bbChange!=null?`<small>${G.bbChange>=0?'+':''}${G.bbChange} overnight</small>`:''}</li>`);
    if(G.hrv!=null) facts.push(`<li><b>${Math.round(G.hrv)}<i>ms</i></b><span>HRV</span>${G.hrvStatus?`<small>${esc(String(G.hrvStatus).toLowerCase())}</small>`:''}</li>`);
    if(Y.garmin && Y.garmin.steps!=null) facts.push(`<li><b>${num(Y.garmin.steps)}</b><span>steps yesterday</span></li>`);
    if(G.resp!=null) facts.push(`<li><b>${Math.round(G.resp)}</b><span>breaths / min</span><small>overnight</small></li>`);
    if(facts.length) html += `<ul class="facts">${facts.join('')}</ul>`;
    el.innerHTML = html;
    F('repn').textContent = Object.keys(G).length ? 'last night · from Garmin' : 'last night · from Health';
  }

  // ---- state of affairs: one row per area ----
  function row(name, href, note, value, unit, flag){
    return `<li><a class="n" href="${href}">${name}</a><span class="d">${note}</span><span class="v ${flag?'flag':''}">${value}<small>${unit}</small></span></li>`;
  }
  function renderAffairs(d){
    const rows=[];
    // finances
    if(d.fin){ const spent=d.fin.tx.reduce((n,t)=>n+t.amt,0), limits=d.fin.cats.reduce((n,c)=>n+c.limit,0), left=limits-spent;
      const due=d.fin.cats.find(c=>c.due && (c.bill || !d.fin.tx.some(t=>t.cat===c.id)) && c.due>=C.now.getDate()), next=(d.fin.plan||[]).filter(p=>p.date>=TODAY).sort()[0];
      const note = due ? `${esc(due.bill||due.name)} ${due.due===C.now.getDate()?'due today':'due on the '+due.due+ordinal(due.due)}` : next ? `Next paycheck ${C.short(C.fromISO(next.date))}, ${$0(next.amt)}` : `${$0(spent)} spent so far`;
      rows.push(row('Finances','finances.html',note,$0(left),`of ${$0(limits)} remaining`, due && due.due===C.now.getDate()));
    } else rows.push(row('Finances','finances.html','Open Finances to set this month’s budget','','not started'));
    // health
    if(d.health){ const L=d.health, meds=L.meds||0, pills=(L.pills||[]).length, total=meds?4:3, n=['sleep','weight','hr'].filter(k=>L[k]!=null).length+(meds&&pills>=meds?1:0);
      const note = L.sleep ? `Slept ${L.sleep} h${L.hr?' · resting pulse '+L.hr:''}` : 'Nothing logged yet today';
      rows.push(row('Health','health.html',note,`${n} of ${total}`,`logged today${meds&&pills<meds?' · '+(meds-pills)+(meds-pills===1?' pill':' pills')+' to take':''}`, false));
    } else rows.push(row('Health','health.html','Nothing logged yet today','0 of 3','logged today'));
    // library
    if(d.lib){ const b=(d.lib.books||[]).find(x=>x.shelf==='reading'), toread=(d.lib.books||[]).filter(x=>x.shelf==='toread').length;
      if(b) rows.push(row('Library','library.html',`${esc(b.title)}, ${esc(b.author)}`, b.pages?`p. ${b.page||0}`:'reading', b.pages?`of ${b.pages} · ${Math.round((b.page||0)/b.pages*100)}%`:'', false));
      else rows.push(row('Library','library.html',`${toread} waiting on the shelf`,'','nothing open'));
    } else rows.push(row('Library','library.html','Open Library to shelve your books','','no books yet'));
    // school
    if(d.school){ const items=(d.school.items||[]).filter(i=>!i.done).sort((a,b)=>a.due<b.due?-1:1), nx=items[0], cn=id=>(d.school.courses||[]).find(c=>c.id===id);
      const dd = nx ? C.daysBetween(TODAY, nx.due) : null;
      const note = nx ? `${esc(cn(nx.course)?.name||'')} — ${esc(nx.title)}, ${dd<0?'overdue':dd===0?'due today':dd===1?'due tomorrow':'due '+C.short(C.fromISO(nx.due))}` : 'Nothing due';
      rows.push(row('School','school.html',note,`${items.length}`,`open ${items.length===1?'item':'items'}`, dd!==null && dd<=0));
    } else rows.push(row('School','school.html','Open School to add your courses','','no courses yet'));
    // calendar
    { const list=d.day||[], later=list.filter(s=>s.start>NOW), next=later[0];
      const lastEnd = list.length ? Math.max(...list.map(s=>s.end)) : null;
      const note = !list.length ? 'A clear day' : lastEnd<=NOW ? 'Nothing more today' : `Free after ${h12(lastEnd)}`;
      rows.push(row('Calendar','calendar.html',note, `${list.length}`, `${list.length===1?'item':'items'} today`, false)); }
    F('affairs').innerHTML = rows.join('');
    F('affn').textContent = C.now.getHours()<12 ? 'this morning' : C.now.getHours()<18 ? 'this afternoon' : 'this evening';
  }
  const ordinal = n => (n%10===1&&n!==11)?'st':(n%10===2&&n!==12)?'nd':(n%10===3&&n!==13)?'rd':'th';

  // ---- greeting with the insight sentence ----
  function renderUpNext(list){
    const cur=list.find(s=>s.start<=NOW&&s.end>NOW), next=list.filter(s=>s.start>NOW)[0], el=F('upnext'), bits=[];
    if(cur) bits.push(`<span><span class="k">Now</span><b>${esc(cur.title)}</b> <span class="t">· until ${h12(cur.end)}</span></span>`);
    if(next){ const mins=Math.round((next.start-NOW)*60); bits.push(`<span><span class="k">Next</span><b>${esc(next.title)}</b> <span class="t">· ${h12(next.start)}, ${mins<60?'in '+mins+' min':'in '+Math.round(mins/60)+' h'}</span></span>`); }
    else if(cur) bits.push(`<span><span class="k">Then</span>free for the rest of the day</span>`);
    else if(list.length) bits.push(`<span><span class="k">Done</span>nothing more today</span>`);
    el.hidden = !bits.length; el.innerHTML = bits.join('');
  }
  function renderGreeting(d){
    const parts=[];
    if(d.school){ const nx=(d.school.items||[]).filter(i=>!i.done).sort((a,b)=>a.due<b.due?-1:1)[0]; if(nx){ const dd=C.daysBetween(TODAY,nx.due); if(dd<=2) parts.push(`${esc(nx.title)} is due ${dd<=0?'today':dd===1?'tomorrow':'in two days'}`); } }
    if(d.fin){ const due=d.fin.cats.find(c=>c.due===C.now.getDate()); if(due) parts.push(`${esc((due.bill||due.name).toLowerCase())} wants paying today`); }
    const s = parts.length ? parts.join('; ') : 'nothing pressing';
    F('greet').innerHTML = `${C.greeting(C.now)}, Jacob. <em>${s[0].toUpperCase()+s.slice(1)}.</em>`;
  }

  // ---- to do: the home's own document, one per day ----
  const TKEY = 'today.' + TODAY; let T = {items:[]};
  const saveT = () => store.save(TKEY, T);
  function renderTodo(){
    const done=T.items.filter(i=>i.done).length;
    F('todon').textContent = T.items.length ? `${done} of ${T.items.length}` : 'nothing yet';
    F('todo').innerHTML = T.items.map((i,k)=>`<li><input type="checkbox" id="t${k}" ${i.done?'checked':''} data-k="${k}"><label for="t${k}">${esc(i.text)}</label><button class="w x" type="button" data-rm="${k}" aria-label="Remove">remove</button></li>`).join('');
  }
  F('todo').addEventListener('change', e=>{ if(e.target.type==='checkbox'){ T.items[+e.target.dataset.k].done=e.target.checked; saveT(); renderTodo(); } });
  F('todo').addEventListener('click', e=>{ const b=e.target.closest('[data-rm]'); if(b){ T.items.splice(+b.dataset.rm,1); saveT(); renderTodo(); } });
  F('addt').addEventListener('submit', e=>{ e.preventDefault(); const t=F('t-text').value.trim(); if(!t) return; T.items.push({text:t,done:false}); F('addt').reset(); saveT(); renderTodo(); });

  // ---- load everything the other pages keep, then draw ----
  (async () => {
    const [cal, fin, H, lib, school, today] = await Promise.all([store.load('calendar'), store.load('finances.'+YM), store.load('health'), store.load('library'), store.load('school'), store.load(TKEY)]);
    if(today) T = today;
    const health = H && H.days ? Object.assign({meds:(H.meds||[]).length}, H.days[TODAY] || {pills:[]}) : null;
    const d = { fin, health, lib, school };
    renderReport(H);
    d.day = renderDay(cal);
    renderAffairs(d); renderGreeting(d); renderUpNext(d.day); renderTodo();
    // the now line, "in 40 min" and the live event move with the clock
    setInterval(() => { const n=new Date(); if(C.iso(n)!==TODAY){ location.reload(); return; } NOW = n.getHours()+n.getMinutes()/60; d.day = renderDay(cal); renderAffairs(d); renderUpNext(d.day); }, 60000);
    F('foot').textContent = store.signedOut ? 'Showing this browser’s copy. Sign in on the welcome page to sync.' : 'Everything here is read from the other pages; only the to-do list lives on Today.';
  })();
  document.getElementById('menubtn').addEventListener('click', e=>{ const b=document.querySelector('.band'); b.classList.toggle('nav-open'); e.currentTarget.setAttribute('aria-expanded', b.classList.contains('nav-open')); });
</script>
</body>
</html>
