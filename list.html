<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HQ — The list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hq.css">
<style>
  .mast{margin-top:20px;padding-top:18px;border-top:1px solid rgba(242,236,223,.28);display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
  h1{font-size:32px;line-height:1.3}
  .mast .sub{font-family:var(--serif);font-style:italic;color:var(--band-muted)}

  main{max-width:1180px;margin:0 auto;padding:34px 40px 44px}
  h2{font-size:22px;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:4px;display:flex;align-items:baseline;gap:12px}
  h2 small{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-left:auto}

  .sift{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0 4px}   /* a ticked box gains a ::after and with it a new baseline; centring is immune to that */
  .sift input[type=search]{flex:1 1 240px;min-width:0;font-family:var(--serif);font-size:15px;border-bottom:1px dotted var(--ink-2);padding:3px 0;background:none}
  .sift input:focus{outline:none;border-bottom-color:var(--ink)}
  .sift input::placeholder{color:var(--ink-3);font-style:italic}
  .sift label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .sift input[type=checkbox]{appearance:none;width:15px;height:15px;border:1px solid var(--ink-2);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--paper);border-radius:2px}
  .sift input:checked{background:var(--band);border-color:var(--band)}
  .sift input:checked::after{content:"";width:7px;height:4px;border:1.5px solid var(--band-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

  /* the sheet: one line per time a thing was on a day */
  .sheet{list-style:none;margin:16px 0 0;padding:0}
  .sheet .head{display:grid;grid-template-columns:88px 1fr 200px 72px;gap:0 18px;padding:0 0 8px;border-bottom:1px solid var(--ink);font-size:12px;color:var(--ink-3);letter-spacing:.04em}
  .sheet li.row{display:grid;grid-template-columns:88px 1fr 200px 72px;gap:0 18px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline;cursor:pointer}
  .sheet li.row:hover{background:var(--paper-2)}
  .sheet .d{font-family:var(--serif);font-size:13.5px;color:var(--ink-3);white-space:nowrap}
  .sheet .d.today{color:var(--ox)}
  .sheet .t{font-family:var(--serif);font-size:15.5px;min-width:0;overflow-wrap:anywhere}
  .sheet li.done .t{color:var(--ink-3);text-decoration:line-through}
  .sheet .m{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px 10px}
  .sheet .m b{font-weight:400;color:var(--ink-2)}
  .sheet .s{font-size:12.5px;text-align:right;white-space:nowrap;color:var(--ink-3)}
  .sheet .s.yes{color:var(--band)}
  .sheet .s.late{color:var(--ox)}

  .sheet li.more{padding:0 0 14px;border-bottom:1px solid var(--rule)}
  .sheet .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-top:2px}
  .sheet .card .big{font-family:var(--serif);font-size:26px;line-height:1.1}
  .sheet .card .big small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .sheet .card .facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:13px;color:var(--ink-3)}
  .sheet .card .facts b{font-weight:400;color:var(--ink-2)}
  .sheet .card .when{margin-top:12px;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 8px}
  .sheet .card .when i{font-style:normal;padding:2px 8px;border:1px solid var(--rule);border-radius:999px}
  .sheet .card .when i.yes{border-color:var(--band);color:var(--band)}
  .sheet .card .when i.no{border-color:var(--ox);color:var(--ox)}
  .sheet .empty{padding:20px 0;color:var(--ink-3);font-style:italic;font-family:var(--serif);text-align:center}

  @media (max-width:860px){
    .sheet .head{display:none}
    .sheet li.row{grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0}
    .sheet .d{grid-column:1;grid-row:1} .sheet .t{grid-column:1;grid-row:2} .sheet .m{grid-column:1;grid-row:3}
    .sheet .s{grid-column:2;grid-row:1/3;align-self:center}
  }
  @media (max-width:760px){ main{padding:24px 20px 36px} .foot{padding:0 20px 28px} }
</style>
</head>
<body>

<header class="band">
  <div class="in">
    <div class="row">
      <a class="mark" href="today.html">HQ</a>
      <span class="date"></span>
      <nav aria-label="Areas"><a href="today.html">Today</a><a href="calendar.html">Calendar</a><a href="finances.html">Finances</a><a href="library.html">Library</a><a href="school.html">School</a><a href="health.html">Health</a></nav>
      <div class="right">
        <button class="ib" aria-label="Search"><svg class="ic"><use href="icons.svg#search"/></svg></button>
        <button class="ib" aria-label="Notifications"><svg class="ic"><use href="icons.svg#bell"/></svg></button>
        <button class="ib menu" type="button" aria-label="Menu" aria-expanded="false" id="menubtn"><svg class="ic"><use href="icons.svg#menu"/></svg></button>
      </div>
    </div>
    <div class="mast">
      <h1>The list</h1>
      <span class="sub" id="sub">every to-do, whatever day it was on</span>
    </div>
  </div>
</header>

<main>
  <h2>Every to-do<small id="count"></small></h2>
  <form class="addt" id="addt"><input id="t-text" placeholder="Anything: a to-do, 12.40 lunch, 173.2, or Dentist Thursday 3–4 pm" required disabled><button class="textbtn" type="submit"><svg class="ic"><use href="icons.svg#plus"/></svg>Add</button></form>
  <div class="propose" id="propose" hidden></div>
  <p class="saidt" id="saidt" hidden></p>
  <div class="sift">
    <input type="search" id="q" placeholder="Find a to-do…" aria-label="Find a to-do">
    <label><input type="checkbox" id="openonly">only what is still open</label>
    <label><input type="checkbox" id="standing">only standing items</label>
  </div>
  <ul class="sheet" id="sheet"><li class="empty">Reading the days…</li></ul>
</main>
<p class="foot">Nothing is stored here; every day's list is read as it stands. <a class="textbtn" href="today.html">Today</a></p>

<script src="clock.js"></script>
<script src="hq.js"></script>
<script src="store.js"></script>
<script src="recur.js"></script>
<script src="capture.js"></script>
<script src="bell.js"></script>
<script src="search.js"></script>
<script>
  const C = clock, TODAY = C.today;
  document.querySelector('.date').textContent = `${C.full(C.now)} · ${C.time(C.now)}`;

  // How far either way to look. A to-do lives in the document for the day it was on, so the only way to see
  // them all is to read the days; 120 back and 45 on covers a term without making the page a download.
  const BACK = 120, AHEAD = 45, YM = TODAY.slice(0, 7);
  let ROWS = [], RULES = { rules: [] }, open = null;
  // what the box writes into. The List is otherwise a read of the days, but the box can make anything, so the
  // three documents the other meanings go to are read along with them.
  let T = { items: [] }, CAL = null, FIN = null, HEALTH = null;

  const dayLabel = iso => iso === TODAY ? 'today'
    : iso === C.iso(C.addDays(C.now, -1)) ? 'yesterday'
    : iso === C.iso(C.addDays(C.now, 1)) ? 'tomorrow'
    : C.dayMonth(C.fromISO(iso));

  // what a to-do is, across the days: a rule if it has one, otherwise its own words
  const idOf = i => i.rule ? 'r:' + i.rule : 't:' + i.text.trim().toLowerCase();

  async function load(){
    const days = [];
    for(let i = -BACK; i <= AHEAD; i++) days.push(C.iso(C.addDays(C.now, i)));
    const [rules, cal, fin, health, ...docs] = await Promise.all([store.load('todo.rules'), store.load('calendar'),
      store.load('finances.' + YM), store.load('health'), ...days.map(d => store.load('today.' + d))]);
    RULES = rules || { rules: [] }; RULES.rules ??= [];
    CAL = cal; FIN = fin; HEALTH = health;
    T = docs[days.indexOf(TODAY)] || { items: [] };
    ROWS = [];
    days.forEach((d, k) => {
      const doc = docs[k]; if(!doc || !doc.items) return;
      doc.items.forEach(i => { if(i && i.text) ROWS.push({ ...i, day: d, key: idOf(i) }); });
    });
    ROWS.sort((a, b) => a.day < b.day ? 1 : a.day > b.day ? -1 : 0);   // newest first, as a ledger reads
    F('t-text').disabled = false;   // not before the days are in, or a capture would write over today's list
    render();
    hqReveal();
  }

  // every time this to-do has been on a day, and how often it was ticked
  const historyOf = key => {
    const all = ROWS.filter(r => r.key === key).sort((a, b) => a.day < b.day ? -1 : 1);
    const past = all.filter(r => r.day <= TODAY);
    return { all, past, ticked: past.filter(r => r.done).length,
             logged: past.reduce((n, r) => n + (+r.did || 0), 0) };
  };

  const mods = r => {
    const out = [];
    if(r.rule){ const rule = RULES.rules.find(x => x.id === r.rule); if(rule) out.push(`<span><b>${esc(hqRecur.says(rule.rep))}</b></span>`); else out.push('<span><b>standing</b></span>'); }
    if(r.at != null) out.push(`<span>by ${h12(r.at)}</span>`);
    if(r.target) out.push(`<span>${r.did != null ? `${r.did} of ` : ''}${r.target.n} ${esc(r.target.unit)}</span>`);
    if(r.from) out.push(`<span>carried from ${dayLabel(r.from)}</span>`);
    return out.join('');
  };

  function render(){
    const q = F('q').value.trim().toLowerCase();
    const openOnly = F('openonly').checked, standingOnly = F('standing').checked;
    const rows = ROWS.filter(r => (!q || r.text.toLowerCase().includes(q))
      && (!openOnly || !r.done) && (!standingOnly || r.rule));
    F('count').textContent = rows.length ? `${rows.length} of ${ROWS.length} lines · ${new Set(rows.map(r => r.key)).size} different` : '';
    if(!rows.length){ F('sheet').innerHTML = '<li class="empty">Nothing matches.</li>'; return; }

    F('sheet').innerHTML = '<li class="head"><span>Day</span><span>To-do</span><span>What it carries</span><span style="text-align:right">Done</span></li>'
      + rows.map((r, k) => {
        const late = !r.done && r.day < TODAY;
        const row = `<li class="row ${r.done ? 'done' : ''}" data-k="${k}" role="button" tabindex="0" aria-expanded="${open === r.key}">
          <span class="d ${r.day === TODAY ? 'today' : ''}">${dayLabel(r.day)}</span>
          <span class="t">${esc(r.text)}</span>
          <span class="m">${mods(r)}</span>
          <span class="s ${r.done ? 'yes' : late ? 'late' : ''}">${r.done ? 'yes' : late ? 'no' : '—'}</span></li>`;
        return row + (open === r.key ? expanded(r) : '');
      }).join('');
  }

  // the fraction, and the days behind it
  function expanded(r){
    const h = historyOf(r.key);
    const rule = r.rule && RULES.rules.find(x => x.id === r.rule);
    const facts = [];
    facts.push(`<span>first on <b>${dayLabel(h.all[0].day)}</b></span>`);
    if(h.all.length > 1) facts.push(`<span>last on <b>${dayLabel(h.all[h.all.length - 1].day)}</b></span>`);
    if(rule) facts.push(`<span>comes back <b>${esc(hqRecur.says(rule.rep))}</b></span>`);
    if(rule && rule.until) facts.push(`<span>until <b>${C.dayMonth(C.fromISO(rule.until))}</b></span>`);
    if(r.target) facts.push(`<span>${h.logged ? `<b>${+h.logged.toFixed(1)}</b> ${esc(r.target.unit)} logged in all` : `nothing logged yet against ${r.target.n} ${esc(r.target.unit)}`}</span>`);
    const recent = h.past.slice(-14);
    return `<li class="more"><div class="card">
      <p class="big">${h.ticked} / ${h.past.length}<small>ticked, of the ${h.past.length === 1 ? 'day' : 'days'} it has been on the list${h.all.length > h.past.length ? ` · ${h.all.length - h.past.length} still to come` : ''}</small></p>
      <p class="facts">${facts.join('')}</p>
      ${recent.length > 1 ? `<p class="when">${recent.map(x => `<i class="${x.done ? 'yes' : 'no'}" title="${dayLabel(x.day)}">${C.dayMonth(C.fromISO(x.day))}</i>`).join('')}</p>` : ''}
    </div></li>`;
  }

  F('sheet').addEventListener('click', e => {
    const li = e.target.closest('.row'); if(!li) return;
    const r = ROWS.filter(x => matches(x))[+li.dataset.k]; if(!r) return;
    open = open === r.key ? null : r.key; render();
  });
  F('sheet').addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const li = e.target.closest('.row'); if(!li) return;
    e.preventDefault(); li.click();
  });
  // the same sieve render() uses, so a row's index means the same thing in both
  const matches = r => {
    const q = F('q').value.trim().toLowerCase();
    return (!q || r.text.toLowerCase().includes(q)) && (!F('openonly').checked || !r.done) && (!F('standing').checked || r.rule);
  };
  ['q', 'openonly', 'standing'].forEach(id => F(id).addEventListener('input', () => { open = null; render(); }));

  // the same box as Today's, from capture.js. A capture can land on any day — tomorrow, next Thursday — so
  // afterwards the days are simply read again rather than guessed at.
  hqCapture({
    todo: () => T,
    rules: () => RULES,
    cal: () => CAL || (CAL = { cats: [{ id: 'cal', name: 'Appointments', tint: '#E9EEF3' }], series: [], notes: {}, hidden: [] }),
    fin: () => FIN || (FIN = { expected: 0, income: [], plan: [], cats: [], tx: [], history: [] }),
    health: () => HEALTH || (HEALTH = { days: {}, meds: [], next: [] }),
    saveTodo: () => store.save('today.' + TODAY, T),
    saveRules: () => store.save('todo.rules', RULES),
    saveCal: () => store.save('calendar', CAL),
    saveFin: () => store.save('finances.' + YM, FIN),
    saveHealth: () => store.save('health', HEALTH),
    redraw: what => { if (what === 'todo') load(); },
  });

  load();
</script>
</body>
</html>
